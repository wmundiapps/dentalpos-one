<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SpaceHour — sem conexão</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Roboto, sans-serif;
         background: linear-gradient(145deg, #073f3e, #0e7c7b); color: #fff; text-align: center; padding: 24px; box-sizing: border-box; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: #fff; color: #0a5f5e; font-weight: 800; font-size: 44px;
          display: grid; place-items: center; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { opacity: .9; margin: 0 0 24px; line-height: 1.5; }
  button { background: #fff; color: #0a5f5e; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 17px; font-weight: 700; }
</style>
</head>
<body>
  <main>
    <div class="mark">S</div>
    <h1>Sem conexão com a internet</h1>
    <p>Confira o Wi-Fi ou os dados móveis e tente de novo.<br>No internet connection — please try again.</p>
    <button onclick="location.href='https://space-hour.com'">Tentar de novo</button>
  </main>
</body>
</html>
