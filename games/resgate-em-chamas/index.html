<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Resgate em Chamas</title>
<style>
:root{
  --bg1:#2a1410; --bg2:#4a1f12; --board:#3a2a22; --tile:#46352b; --gold:#ffc83d; --ink:#fff7ea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg1));gap:8px}
#app.danger::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 10px rgba(255,60,20,.55);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hud{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);font-size:18px}
.lvl{flex:1;display:flex;flex-direction:column;line-height:1.15}
.lvl b{font-size:18px}.lvl small{opacity:.8;font-size:12px}
.coins{background:rgba(0,0,0,.35);padding:8px 12px;border-radius:20px;font-weight:700;color:var(--gold)}
.trackWrap{display:flex;flex-direction:column;gap:6px}
.track{position:relative;margin:6px 34px 2px 26px;height:42px;border-radius:21px;background:#8a5a3c;border:2px dashed rgba(255,235,200,.6);display:flex;align-items:center;padding:0 10px}
.segs{display:flex;width:100%}
.seg{flex:1;text-align:center;font-size:22px;line-height:1;transition:opacity .4s,filter .4s;animation:flick .6s infinite alternate}
.seg:nth-child(2n){animation-delay:.2s}
.seg.out{opacity:.25;filter:grayscale(1);animation:none}
@keyframes flick{from{transform:scale(.9) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}
#rescuer{position:absolute;top:50%;left:10px;font-size:30px;transform:translate(-50%,-55%);transition:left .5s ease;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#goal{position:absolute;right:-32px;top:50%;font-size:34px;transform:translateY(-55%);filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}
#app.danger #goal{animation:shk .25s infinite}
@keyframes shk{0%,100%{transform:translateY(-55%) rotate(-6deg)}50%{transform:translateY(-55%) rotate(6deg)}}
.timebar{position:relative;height:16px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);transition:width .1s linear,background .3s}
.timebar i.low{background:linear-gradient(90deg,#f97316,#ef4444)}
.timebar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:700;line-height:16px;text-shadow:0 1px 2px #000}
#tip{min-height:18px;text-align:center;font-size:13px;opacity:.9}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{position:relative;overflow:hidden;border-radius:14px;background-color:var(--board);box-shadow:0 0 0 4px #6b4a36,0 8px 24px rgba(0,0,0,.5);
  background-image:linear-gradient(var(--tile) 1px,transparent 1px),linear-gradient(90deg,var(--tile) 1px,transparent 1px)}
.blk{position:absolute;border-radius:10px;background:var(--c);display:flex;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer;transition:filter .2s}
.blk::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(255,255,255,.35),rgba(0,0,0,.2));pointer-events:none}
.blk::after{content:"";position:absolute;inset:3px;border-radius:8px;border:2px dashed rgba(255,255,255,.28);pointer-events:none}
.blk svg{position:relative;width:60%;max-width:34px;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));z-index:1}
.blk .fx{position:relative;font-size:calc(var(--cs)*.45);z-index:1}
.blk.go{transition:transform .5s cubic-bezier(.4,0,.8,.5);z-index:5;pointer-events:none}
.blk.shake{animation:shake .3s}
.blk.warn{filter:brightness(.6) saturate(2);outline:3px solid #ff3b30;z-index:3}
.blk.hint{animation:hint .5s infinite alternate;z-index:4}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes hint{from{transform:scale(1)}to{transform:scale(1.1);filter:brightness(1.35)}}
.rubble{position:absolute;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.6);background:#2b211c;border-radius:8px;box-shadow:inset 0 0 0 2px #5a463a}
.tray{display:flex;gap:8px}
.slot{flex:1;height:44px;border-radius:10px;background:#8a5a3c;box-shadow:inset 0 3px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:26px}
.slot.on{animation:pop .3s}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.tools{display:flex;gap:8px}
.tool{flex:1;padding:10px 6px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:700;font-size:14px}
.tool small{display:block;font-weight:500;opacity:.85;color:var(--gold)}
.tool:disabled{opacity:.4}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.float{position:absolute;font-weight:800;color:var(--gold);text-shadow:0 1px 3px #000;animation:up .9s ease-out forwards;transform:translate(-50%,-50%)}
.water{position:absolute;font-size:26px;animation:up .8s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes up{to{opacity:0;margin-top:-50px}}
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(10,4,2,.72);padding:20px}
#modal.hidden{display:none}
.card{width:100%;background:linear-gradient(180deg,#5a2d1a,#34170e);border:2px solid #ffb347;border-radius:22px;padding:22px 18px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:pop .3s}
.card h1{margin:0 0 6px;font-size:26px}.card h2{margin:0 0 8px;font-size:22px}
.card p{margin:6px 0;opacity:.92;font-size:15px}
.big{font-size:56px;margin:4px 0}
.stars{font-size:34px;letter-spacing:4px}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:16px;font-weight:800;font-size:17px;background:linear-gradient(#ffd24a,#ff9f1a);color:#3a1d00;box-shadow:0 4px 0 #b36a00}
.btn.alt{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:none}
.btn:disabled{opacity:.45}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <button class="ib" id="btnHome" aria-label="Menu">☰</button>
    <div class="lvl"><b id="lvlTxt">Fase 1</b><small id="lvlTag"></small></div>
    <div class="coins">🪙 <span id="coins">0</span></div>
    <button class="ib" id="btnSnd" aria-label="Som">🔊</button>
  </header>
  <section class="trackWrap">
    <div class="track" id="track"><div class="segs" id="segs"></div><div id="rescuer">🧑‍🚒</div><div id="goal">💎</div></div>
    <div class="timebar"><i id="timefill"></i><span id="timeTxt"></span></div>
  </section>
  <div id="tip"></div>
  <main class="stage"><div id="board"></div></main>
  <section class="tray" id="tray"></section>
  <footer class="tools">
    <button class="tool" id="btnHint">💡 Dica<small>🪙 20</small></button>
    <button class="tool" id="btnTime">⏱️ +15 segundos<small>🪙 30</small></button>
  </footer>
  <div id="fx"></div>
  <div id="modal" class="hidden"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const PAL = ['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6','#eab308'];
const GOALS = [['💎','o diamante'],['🖼️','a obra de arte'],['👑','a coroa'],['🏺','o vaso antigo'],['🎻','o violino'],['🗿','a estátua']];
const COST_HINT = 20, COST_TIME = 30, SLOTS = 4;

/* ---------- progresso salvo ---------- */
let save = {level:1,coins:0,sound:true};
try { Object.assign(save, JSON.parse(localStorage.getItem('rec_save')||'{}')); } catch(e){}
const persist = () => { try { localStorage.setItem('rec_save', JSON.stringify(save)); } catch(e){} };

/* ---------- som ---------- */
let ac;
function tone(f,d,type='sine',v=.07,delay=0){
  if(!save.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime+delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const sfx = {
  go:()=>{tone(300,.12,'triangle');tone(480,.12,'triangle',.07,.08)},
  bad:()=>tone(120,.2,'sawtooth',.06),
  coin:()=>tone(1100,.1,'square',.03),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.08,i*.12)),
  lose:()=>[300,240,180].forEach((f,i)=>tone(f,.3,'sawtooth',.06,i*.18)),
};

/* ---------- gerador de fases (sempre resolvível) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// células à frente do bloco até a borda, da mais próxima para a mais distante
function rayCells(b,cols,rows){
  const out=[];
  if(b.dir==='R') for(let x=b.x+b.w;x<cols;x++) for(let y=b.y;y<b.y+b.h;y++) out.push([x,y]);
  if(b.dir==='L') for(let x=b.x-1;x>=0;x--) for(let y=b.y;y<b.y+b.h;y++) out.push([x,y]);
  if(b.dir==='D') for(let y=b.y+b.h;y<rows;y++) for(let x=b.x;x<b.x+b.w;x++) out.push([x,y]);
  if(b.dir==='U') for(let y=b.y-1;y>=0;y--) for(let x=b.x;x<b.x+b.w;x++) out.push([x,y]);
  return out;
}

function levelInfo(n){
  const easy = n<=3 || n%5===0;
  let d = Math.min(1,(n-1)/45);
  if(easy) d *= .35; else if(n%5===4) d = Math.min(1,d+.12);
  return {easy,d,hard:!easy && n%5===4};
}

// Cada bloco novo só é colocado se o caminho dele estiver livre; ele pode travar os
// anteriores. Logo, retirar os blocos na ordem inversa da criação sempre resolve a fase.
function genLevel(n){
  const {easy,d,hard} = levelInfo(n);
  const cols = 4+Math.min(3,Math.floor(d*3.99)), rows = 5+Math.min(4,Math.floor(d*4.99));
  const rand = mulberry32(n*7919+104729);
  const occ = Array.from({length:rows},()=>Array(cols).fill(0));
  const obst = [];
  if(!easy && n>=8){
    let c = Math.floor(d*cols/1.4)+1;
    while(c-- > 0){ const x=rand()*cols|0, y=rand()*rows|0; if(!occ[y][x]){occ[y][x]=-1;obst.push([x,y]);} }
  }
  const target = Math.floor((cols*rows-obst.length)*(.5+.3*d));
  const blocks = [];
  let cells = 0, tries = 0;
  const cand = () => {
    const dir = 'UDLR'[rand()*4|0], horiz = dir==='L'||dir==='R';
    const r = rand(), len = r<(d<.5?.2:.1)?1:(r<.75?2:3);
    const w = horiz?len:1, h = horiz?1:len;
    const x = rand()*(cols-w+1)|0, y = rand()*(rows-h+1)|0;
    for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) if(occ[j][i]) return null;
    const b = {x,y,w,h,dir,len};
    if(rayCells(b,cols,rows).some(([i,j])=>occ[j][i])) return null;
    return b;
  };
  const score = c => {
    const mine = new Set(); for(let j=c.y;j<c.y+c.h;j++) for(let i=c.x;i<c.x+c.w;i++) mine.add(i+','+j);
    return blocks.filter(b=>rayCells(b,cols,rows).some(([i,j])=>mine.has(i+','+j))).length;
  };
  while(cells<target && tries<4000){
    tries++;
    let best=null,bs=-1,found=0;
    const smart = rand()<d*.9;
    for(let k=0;k<30 && found<12;k++){
      const c = cand(); if(!c) continue; found++;
      if(!smart){ best=c; break; }
      const s = score(c); if(s>bs){bs=s;best=c;}
    }
    if(!best) continue;
    best.id = blocks.length+1;
    best.color = PAL[rand()*PAL.length|0];
    for(let j=best.y;j<best.y+best.h;j++) for(let i=best.x;i<best.x+best.w;i++) occ[j][i]=best.id;
    blocks.push(best); cells += best.len;
  }
  const time = Math.round((blocks.length*(2.8-1.1*d)+10)*(easy?1.4:1));
  return {n,cols,rows,blocks,obst,time,easy,hard,goal:GOALS[(n-1)%GOALS.length]};
}

/* ---------- estado da partida ---------- */
let L, G, cs = 40;
const el = {
  board:$('#board'),segs:$('#segs'),resc:$('#rescuer'),goal:$('#goal'),tray:$('#tray'),
  fill:$('#timefill'),ttxt:$('#timeTxt'),coins:$('#coins'),modal:$('#modal'),app:$('#app'),tip:$('#tip'),fx:$('#fx')
};
const ARROW_ROT = {R:0,D:90,L:180,U:270};
const ARROW_SVG = '<svg viewBox="0 0 24 24"><path d="M3 12h15M12 5l7 7-7 7" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function showCoins(){ el.coins.textContent = save.coins; el.coins.parentElement.classList.remove('x'); }
function toast(t){ el.tip.textContent = t; clearTimeout(toast.t); toast.t = setTimeout(()=>{ el.tip.textContent = G&&G.tip||''; },1800); }

function startLevel(n){
  L = genLevel(n);
  G = {
    occ: Array.from({length:L.rows},()=>Array(L.cols).fill(0)),
    alive: new Map(), total: L.blocks.length, removed:0, dispatched:0,
    time: L.time, max: L.time, slots: Array(SLOTS).fill(false), running:true, ended:false, last: performance.now(),
    segN: Math.max(5,Math.min(12,L.blocks.length)),
    tip: n===1 ? 'Toque num bombeiro com o caminho livre na direção da seta.' : n===2 ? 'Se algo estiver na frente, ele não sai. Libere o caminho primeiro!' : ''
  };
  L.obst.forEach(([x,y])=>G.occ[y][x]=-1);
  el.board.innerHTML = '';
  L.obst.forEach(([x,y])=>{ const o=document.createElement('div'); o.className='rubble'; o.textContent='🧱'; o.dataset.x=x; o.dataset.y=y; el.board.appendChild(o); });
  L.blocks.forEach(b=>{
    for(let j=b.y;j<b.y+b.h;j++) for(let i=b.x;i<b.x+b.w;i++) G.occ[j][i]=b.id;
    const d=document.createElement('div'); d.className='blk'; d.style.setProperty('--c',b.color);
    d.innerHTML = (b.len>1?'<span class="fx">🧑‍🚒</span>':'') + ARROW_SVG;
    d.querySelector('svg').style.transform = `rotate(${ARROW_ROT[b.dir]}deg)`;
    d.addEventListener('pointerdown',e=>{e.preventDefault();onTap(b);});
    b.el = d; el.board.appendChild(d); G.alive.set(b.id,b);
  });
  el.segs.innerHTML = '<div class="seg">🔥</div>'.repeat(G.segN);
  el.goal.textContent = L.goal[0];
  el.tray.innerHTML = '<div class="slot"></div>'.repeat(SLOTS);
  $('#lvlTxt').textContent = 'Fase '+n;
  $('#lvlTag').textContent = L.easy ? 'Fase tranquila 🌿' : L.hard ? 'Fase difícil 🔥' : 'Resgate '+L.goal[1];
  el.app.classList.remove('danger');
  el.modal.classList.add('hidden');
  el.tip.textContent = G.tip;
  showCoins(); layout(); setProgress(); drawTime();
}

function layout(){
  if(!L) return;
  const st = $('.stage');
  cs = Math.max(26,Math.floor(Math.min((st.clientWidth-8)/L.cols,(st.clientHeight-8)/L.rows,72)));
  const b = el.board;
  b.style.width = L.cols*cs+'px'; b.style.height = L.rows*cs+'px';
  b.style.backgroundSize = cs+'px '+cs+'px'; b.style.setProperty('--cs',cs+'px');
  b.querySelectorAll('.rubble').forEach(o=>pos(o,+o.dataset.x,+o.dataset.y,1,1));
  L.blocks.forEach(bl=>{ if(bl.el && G.alive.has(bl.id)) pos(bl.el,bl.x,bl.y,bl.w,bl.h); });
}
function pos(e,x,y,w,h){ e.style.left=x*cs+2+'px'; e.style.top=y*cs+2+'px'; e.style.width=w*cs-4+'px'; e.style.height=h*cs-4+'px'; }
window.addEventListener('resize',layout);

function blockerOf(b){
  for(const [x,y] of rayCells(b,L.cols,L.rows)){ const v=G.occ[y][x]; if(v) return v; }
  return 0;
}

function onTap(b){
  if(!G.running || !G.alive.has(b.id)) return;
  const bl = blockerOf(b);
  if(bl){
    b.el.classList.remove('shake'); void b.el.offsetWidth; b.el.classList.add('shake');
    const o = G.alive.get(bl);
    if(o){ o.el.classList.add('warn'); setTimeout(()=>o.el.classList.remove('warn'),450); }
    else toast('Entulho no caminho! Esse bombeiro não passa.');
    sfx.bad(); return;
  }
  const si = G.slots.findIndex(s=>!s);
  if(si<0){ toast('Os bombeiros estão ocupados, espere um instante!'); sfx.bad(); return; }
  // sai do tabuleiro
  G.slots[si]=true; G.alive.delete(b.id); G.removed++;
  for(let j=b.y;j<b.y+b.h;j++) for(let i=b.x;i<b.x+b.w;i++) G.occ[j][i]=0;
  const dist = {R:(L.cols-b.x)*cs,L:-(b.x+b.w)*cs,D:(L.rows-b.y)*cs,U:-(b.y+b.h)*cs}[b.dir];
  const r = b.el.getBoundingClientRect();
  b.el.classList.remove('hint'); b.el.classList.add('go');
  requestAnimationFrame(()=>{ b.el.style.transform = (b.dir==='L'||b.dir==='R')?`translateX(${dist}px)`:`translateY(${dist}px)`; });
  setTimeout(()=>b.el.remove(),550);
  sfx.go();
  save.coins++; persist(); showCoins(); sfx.coin();
  floatText('+1 🪙', r.left+r.width/2, r.top+r.height/2);
  const slot = el.tray.children[si]; slot.textContent='🧑‍🚒'; slot.classList.remove('on'); void slot.offsetWidth; slot.classList.add('on');
  setTimeout(()=>{
    slot.textContent='💦'; const sr=slot.getBoundingClientRect();
    G.dispatched++; setProgress(); water();
    if(G.dispatched===G.total) setTimeout(win,500);
    setTimeout(()=>{slot.textContent='';G.slots[si]=false;},500);
  },600);
  if(G.removed===G.total){ G.running=false; }   // para o relógio: a fase já está ganha
}

function setProgress(){
  const ext = Math.floor(G.dispatched*G.segN/G.total);
  [...el.segs.children].forEach((s,i)=>s.classList.toggle('out',i<ext));
  el.resc.style.left = `calc(10px + (100% - 20px) * ${ext/G.segN})`;
}
function water(){
  const r = el.resc.getBoundingClientRect();
  const w = document.createElement('div'); w.className='water'; w.textContent='💦';
  w.style.left=r.left+r.width/2+'px'; w.style.top=r.top+'px'; el.fx.appendChild(w); setTimeout(()=>w.remove(),900);
}
function floatText(t,x,y){
  const f=document.createElement('div'); f.className='float'; f.textContent=t; f.style.left=x+'px'; f.style.top=y+'px';
  el.fx.appendChild(f); setTimeout(()=>f.remove(),950);
}

/* ---------- tempo (o fogo avança) ---------- */
function drawTime(){
  const p = Math.max(0,G.time/G.max);
  el.fill.style.width = (p*100)+'%'; el.fill.classList.toggle('low',p<.25);
  el.ttxt.textContent = '🔥 '+Math.ceil(Math.max(0,G.time))+'s';
  el.app.classList.toggle('danger',p<.25 && G.running);
}
setInterval(()=>{
  if(!G) return;
  const now = performance.now(), dt = Math.min(.5,(now-G.last)/1000); G.last = now;
  if(!G.running || G.ended) return;
  G.time -= dt; drawTime();
  if(G.time<=0) lose();
},100);

/* ---------- fim de fase ---------- */
function win(){
  if(G.ended) return; G.ended = true; G.running = false;
  const p = G.time/G.max, stars = p>=.5?3:p>=.25?2:1;
  const bonus = 10 + stars*5 + Math.min(L.n,30);
  save.coins += bonus; save.level = Math.max(save.level,L.n+1); persist(); showCoins();
  el.app.classList.remove('danger'); sfx.win();
  el.resc.style.left = 'calc(100% - 10px)';
  modal(`<div class="big">${L.goal[0]}</div><h2>Resgatado com sucesso!</h2>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>Bônus da fase: <b>+${bonus} 🪙</b></p><p>Você tem <b>${save.coins} 🪙</b></p>
    <button class="btn" data-a="next">Próxima fase ▶</button>
    <button class="btn alt" data-a="retry">Jogar de novo</button>`);
}
function lose(){
  if(G.ended) return; G.ended = true; G.running = false;
  el.app.classList.remove('danger'); sfx.lose();
  modal(`<div class="big">😱🔥</div><h2>O fogo chegou ao tesouro!</h2>
    <p>Faltaram ${G.total-G.removed} bombeiros. Não desanime, você consegue!</p>
    <button class="btn" data-a="more" ${save.coins<COST_TIME?'disabled':''}>Continuar +15s (🪙 ${COST_TIME})</button>
    <button class="btn alt" data-a="retry">Tentar de novo</button>
    <button class="btn alt" data-a="home">Menu</button>`);
}
function modal(html){
  el.modal.innerHTML = '<div class="card">'+html+'</div>'; el.modal.classList.remove('hidden');
}
el.modal.addEventListener('click',e=>{
  const a = e.target.dataset && e.target.dataset.a; if(!a) return;
  if(a==='start' || a==='retry') startLevel(L && a==='retry' ? L.n : levelFromUrl() || save.level);
  else if(a==='next') startLevel(L.n+1);
  else if(a==='home') home();
  else if(a==='more' && save.coins>=COST_TIME){
    save.coins -= COST_TIME; persist(); showCoins();
    G.time += 15; G.max = Math.max(G.max,G.time); G.ended = false; G.running = true; G.last = performance.now();
    el.modal.classList.add('hidden'); drawTime();
  }
  else if(a==='resume'){ el.modal.classList.add('hidden'); if(G){G.running=true;G.last=performance.now();} }
  else if(a==='reset' && confirm('Apagar seu progresso e moedas?')){ save={level:1,coins:0,sound:save.sound}; persist(); showCoins(); home(); }
});
function levelFromUrl(){ const n = parseInt(new URLSearchParams(location.search).get('nivel'),10); return n>0 ? n : 0; }

function home(){
  if(G) G.running = false;
  const n = (G&&G.ended===false&&L) ? L.n : (levelFromUrl() || save.level);
  modal(`<div class="big">🧑‍🚒🔥</div><h1>Resgate em Chamas</h1>
    <p>Toque nos bombeiros para abrir caminho, apague o fogo e resgate o tesouro antes que as chamas cheguem nele!</p>
    <p>Fase atual: <b>${n}</b> · 🪙 <b>${save.coins}</b></p>
    ${G&&!G.ended&&L?'<button class="btn" data-a="resume">Continuar</button><button class="btn alt" data-a="retry">Reiniciar fase</button>':'<button class="btn" data-a="start">Jogar ▶</button>'}
    <button class="btn alt" data-a="reset" style="font-size:13px;padding:8px">Recomeçar do zero</button>`);
}

/* ---------- poderes e botões ---------- */
$('#btnHint').addEventListener('click',()=>{
  if(!G||!G.running) return;
  if(save.coins<COST_HINT) return toast('Moedas insuficientes. Complete fases para ganhar mais!');
  const free = [...G.alive.values()].filter(b=>!blockerOf(b));
  if(!free.length) return;
  save.coins -= COST_HINT; persist(); showCoins();
  const b = free[Math.random()*free.length|0];
  b.el.classList.add('hint'); setTimeout(()=>b.el.classList.remove('hint'),2500);
});
$('#btnTime').addEventListener('click',()=>{
  if(!G||!G.running) return;
  if(save.coins<COST_TIME) return toast('Moedas insuficientes. Complete fases para ganhar mais!');
  save.coins -= COST_TIME; persist(); showCoins();
  G.time += 15; G.max = Math.max(G.max,G.time); drawTime();
});
$('#btnHome').addEventListener('click',home);
function drawSnd(){ $('#btnSnd').textContent = save.sound?'🔊':'🔇'; }
$('#btnSnd').addEventListener('click',()=>{ save.sound=!save.sound; persist(); drawSnd(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && G && G.running && !G.ended) home(); });

drawSnd(); showCoins();
window.RC = {genLevel,rayCells,get G(){return G},get L(){return L},startLevel};
home();
})();
</script>
</body>
</html>
