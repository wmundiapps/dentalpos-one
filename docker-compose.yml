services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dentalpos
      POSTGRES_PASSWORD: dentalpos
      POSTGRES_DB: dentalpos
    ports:
      - "5432:5432"
    volumes:
      - dentalpos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalpos -d dentalpos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dentalpos_postgres:
