<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Odonto Odisseia: jogo de treinamento. Dentro do DentalPos One roda em iframe (?host=dentalpos&modulo=carreira|jobrotation) e conversa com a página Treinamento por postMessage. -->
<title>Odonto Odisseia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra de status no topo, a clínica em corte (cena ilustrada) à esquerda com patrimônio e metas, painel de abas à direita; empilha no celular. */
:root{
  --bg:#edf3f2; --panel:#ffffff; --panel2:#f3f8f7; --inset:#e6efed; --line:#d3e0dd; --fg:#14292b; --mute:#5b7371;
  --accent:#0f8b8d; --accent-d:#0b6d6f; --on-accent:#ffffff;
  --gold:#b7800a; --gum:#c94d77; --ok:#24915a; --bad:#cf3f3f; --info:#2f6fd0;
  --sky1:#cfe8f1; --sky2:#f2f8f9; --night:0;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1617; --panel:#132122; --panel2:#182a2b; --inset:#0f1c1d; --line:#26393a; --fg:#e3eeed; --mute:#8ba3a1;
  --accent:#36bfbd; --accent-d:#238d8b; --on-accent:#052223;
  --gold:#e5b043; --gum:#ec7f9f; --ok:#5ccb8b; --bad:#ff7a7a; --info:#7fb0ff;
  --sky1:#1c2f3d; --sky2:#33495a; --night:1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1617; --panel:#132122; --panel2:#182a2b; --inset:#0f1c1d; --line:#26393a; --fg:#e3eeed; --mute:#8ba3a1;
  --accent:#36bfbd; --accent-d:#238d8b; --on-accent:#052223;
  --gold:#e5b043; --gum:#ec7f9f; --ok:#5ccb8b; --bad:#ff7a7a; --info:#7fb0ff;
  --sky1:#1c2f3d; --sky2:#33495a; --night:1; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:12px 40px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.btn{background:var(--panel2);border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;border-radius:8px;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tab:focus-visible,.diff:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.btn.gold{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}
.btn.ok{background:transparent;color:var(--ok);border-color:var(--ok)}
.btn.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent-d)}

.hud{display:grid;grid-template-columns:auto 1fr auto;gap:12px 20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.brand h1{font-size:22px;line-height:1.05}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.brand .who{color:var(--mute);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;margin-top:3px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.adv{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 18px}
.bar{display:flex;flex-direction:column;gap:4px}
.bar .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.track{height:8px;background:var(--inset);border-radius:99px;position:relative;overflow:hidden}
.fill{height:100%;background:var(--ok);border-radius:99px}

.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.card h2{font-size:18px;margin-bottom:8px}
.card h3{font-size:14px;margin:16px 0 6px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-family:var(--body);font-weight:700}
.world{padding:0;overflow:hidden}
#world{display:block;width:100%}
.assets{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.chip b{font-weight:700}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--ok);color:var(--ok)}
.goals{display:flex;flex-direction:column;gap:10px}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px}
.goal .track{grid-column:1/-1;height:7px}
.goal .fill{background:var(--gold)}
.goal.done .fill{background:var(--ok)}
.deadline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}

.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tab{background:transparent;border:1px solid transparent;border-radius:99px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--mute)}
.tab:hover{color:var(--fg);border-color:var(--line)}
.tab.act{color:var(--on-accent);background:var(--accent)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:600}
.row .d{font-size:12px;color:var(--mute);grid-column:1}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;grid-row:1/span 2;grid-column:2}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border:1px solid var(--line);border-radius:99px;margin-left:6px;font-weight:600;vertical-align:1px}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.gold{color:var(--gold);border-color:var(--gold)} .pill.gum{color:var(--gum);border-color:var(--gum)}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px}
.slider{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.slider label{display:flex;justify-content:space-between;font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number],input[type=text],select{background:var(--inset);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:6px 8px;font:inherit}
.ledger{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:13px}
.ledger .p{color:var(--ok)} .ledger .n{color:var(--bad)}
.ledger .sum{border-top:1px solid var(--line);padding-top:4px;margin-top:4px;font-weight:700}
.tip{font-size:12px;color:var(--mute);background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:8px 10px;margin:8px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 4px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.kpi.warn{border-color:var(--bad)} .kpi.warn b{color:var(--bad)}
.log{display:flex;flex-direction:column;gap:5px;max-height:420px;overflow:auto;font-size:13px}
.log div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.log .m{color:var(--mute);font-variant-numeric:tabular-nums}
.log .good{color:var(--ok)} .log .bad{color:var(--bad)} .log .gold{color:var(--gold)}
.amtbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.amtbar input{width:150px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)} .chart .lab{fill:var(--mute)} .chart .goalln{stroke:var(--gold)} .chart .goalt{fill:var(--gold)}
.chart .area{fill:var(--accent);opacity:.14} .chart .ln{stroke:var(--accent)} .chart .dot{fill:var(--accent)}

.ov{position:fixed;inset:0;background:rgba(6,18,19,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:14px;max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:22px}
.modal.badm{border-top-color:var(--bad)} .modal.badm h2{color:var(--bad)}
.modal.goodm{border-top-color:var(--ok)} .modal.goodm h2{color:var(--ok)}
.modal p{margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .btn{text-align:left}

.intro{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:8px}
.intro h1{font-size:clamp(36px,7vw,66px);line-height:.98;letter-spacing:-.03em}
.intro h1 em{font-style:normal;color:var(--accent)}
.intro .lead{font-size:16px;max-width:62ch;color:var(--mute)}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.diff{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.diff:hover{border-color:var(--accent)}
.diff h3{font-size:21px;color:var(--fg);margin:0}
.diff .x{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.diff ul{margin:0;padding-left:16px;font-size:12.5px}
.diff li{margin:2px 0}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.howto div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px}
.howto b{font-family:var(--display);color:var(--accent);font-size:16px;display:block;margin-bottom:2px}

.shift{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:12px 16px 24px}
.shift .in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.shbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.clock{font-family:var(--display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.shstats{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end;font-size:13px}
.shstats b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums;display:block}
.daybar{height:10px;background:var(--inset);border-radius:99px;overflow:hidden}
.daybar i{display:block;height:100%;background:var(--accent);width:0}
.shgrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:12px;align-items:start}
.wait{display:flex;flex-direction:column;gap:6px}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.pcard:hover{border-color:var(--accent)}
.pcard .pn{font-weight:700} .pcard .pc{font-size:12px;color:var(--mute);grid-column:1/-1}
.pcard .pb{grid-column:1/-1;height:6px;background:var(--inset);border-radius:99px;overflow:hidden}
.pcard .pb i{display:block;height:100%;background:var(--ok)}
.pcard.urg{border-color:var(--bad)}
.pcard.dim{opacity:.55;cursor:default}
.pcard .st{font-size:11px;font-weight:700}
.chairbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:340px;display:flex;flex-direction:column;gap:10px}
.quote{font-size:17px;font-family:var(--display);font-weight:600}
.teeth{display:flex;gap:4px;align-items:flex-end}
.teeth span{width:26px;height:34px;border-radius:9px 9px 12px 12px;background:#f6f3ea;border:2px solid #d8d2c2;position:relative}
.teeth span.hit{border-color:var(--bad);box-shadow:0 0 0 3px rgba(207,63,63,.25)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opts .btn{padding:10px;text-align:left}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps .btn{padding:10px 12px}
.steps .btn.hint{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.seq{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.seq span{padding:3px 8px;border-radius:99px;border:1px dashed var(--line);color:var(--mute)}
.seq span.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
.tbar{height:12px;background:var(--inset);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--gold)}
.shmsg{font-size:13px;min-height:20px}
.shmsg.bad{color:var(--bad)} .shmsg.good{color:var(--ok)}
.brk{background:var(--bad);color:#fff;border-radius:10px;padding:10px;font-weight:700;text-align:center}
.report{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;width:100%}
.proto{border-bottom:1px solid var(--line);padding:7px 0;font-size:13px}.proto summary{cursor:pointer}.proto ol{margin:6px 0 4px;padding-left:22px}.proto li{margin:2px 0}
.big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
@media (max-width:760px){.shgrid{grid-template-columns:minmax(0,1fr)}.chairbox{order:-1;min-height:0}.pcard.dim{display:none}.shbar{grid-template-columns:minmax(0,1fr)}.shstats{justify-content:flex-start}}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .hud{grid-template-columns:minmax(0,1fr)}
  .adv{justify-content:flex-start}
  .bars{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .stat b{font-size:15px}
  .row{grid-template-columns:minmax(0,1fr)}
  .row .acts{grid-row:auto;grid-column:1;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<script>
'use strict';
/* ============ ponte com o DentalPos One (quando o jogo roda dentro do sistema) ============ */
const QS=new URLSearchParams(location.search);
const HOSTED=QS.get('host')==='dentalpos'&&window.parent!==window;
const HOST_MODULE=QS.get('modulo')==='jobrotation'?'jobrotation':'carreira';
let HOSTDATA=null,HOSTREM=0;const hostTimers={};
function hostPost(msg){try{window.parent.postMessage(msg,location.origin)}catch(e){}}
function hostSave(module,state,now){clearTimeout(hostTimers[module]);const send=()=>hostPost({type:'dp:save',module,state:JSON.parse(JSON.stringify(state))});if(now)send();else hostTimers[module]=setTimeout(send,800);}
/* ============ utilidades ============ */
const $=q=>document.querySelector(q);
const R=()=>Math.random();
const rand=(a,b)=>a+(b-a)*R();
const randn=()=>{let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(R()*a.length)];
function money(n){const a=Math.abs(n),sg=n<0?'−':'';
  if(a>=1e9)return sg+'R$ '+(a/1e9).toFixed(2).replace('.',',')+' bi';
  if(a>=1e6)return sg+'R$ '+(a/1e6).toFixed(2).replace('.',',')+' mi';
  if(a>=1e4)return sg+'R$ '+(a/1e3).toFixed(1).replace('.',',')+' mil';
  return sg+'R$ '+Math.round(a).toLocaleString('pt-BR');}
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dateL=m=>MES[m%12]+'/'+(2027+Math.floor(m/12));
const age=s=>24+Math.floor(s.m/12);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ dados do jogo ============ */
const DIFF={
  simples:{n:'Simples',x:'1×',years:25,ev:0.7,g:{passive:8000,nw:1.2e6}},
  mediano:{n:'Mediano',x:'2× + metas extras',years:25,ev:1.0,g:{passive:16000,nw:2.4e6,props:2,clinic:2}},
  super:{n:'Super',x:'5×',years:25,ev:1.2,g:{passive:40000,nw:6e6,props:5,biz:1,clinic:3}},
  hiper:{n:'Hiper',x:'15×',years:25,ev:1.4,g:{passive:120000,nw:18e6,props:12,biz:3,clinic:4}},
  ultra:{n:'Ultra',x:'100× em 32 anos',years:32,ev:1.6,g:{passive:800000,nw:120e6,props:30,biz:6,clinic:5,franq:40}},
};
const CLINIC=[
  {n:'Sem clínica própria',cost:0,fixed:0,chairs:0,vis:0},
  {n:'Sala alugada',cost:25000,fixed:3500,chairs:1,vis:1},
  {n:'Consultório',cost:90000,fixed:8000,chairs:2,vis:1.3},
  {n:'Clínica',cost:300000,fixed:20000,chairs:4,vis:1.8},
  {n:'Clínica Premium',cost:900000,fixed:45000,chairs:8,vis:2.6},
  {n:'Policlínica Referência',cost:2500000,fixed:90000,chairs:16,vis:4},
];
const MKT=[{n:'Sem marketing',c:0,d:0},{n:'Instagram básico',c:1500,d:80},{n:'Agência de marketing',c:6000,d:250},{n:'Campanha forte',c:20000,d:700}];
const HOUSE=[
  {n:'Kitnet alugada',buy:0,cost:1200,happy:0},
  {n:'Apartamento alugado',buy:0,cost:2800,happy:8},
  {n:'Apartamento próprio',buy:450000,cost:1200,happy:16},
  {n:'Casa em condomínio',buy:1400000,cost:3500,happy:26},
  {n:'Mansão',buy:5000000,cost:12000,happy:36},
];
const CAR=[
  {n:'Ônibus e aplicativo',buy:0,cost:350,happy:0},
  {n:'Popular usado',buy:45000,cost:900,happy:5},
  {n:'Sedan',buy:140000,cost:1800,happy:10},
  {n:'SUV',buy:320000,cost:3000,happy:15},
  {n:'Importado',buy:900000,cost:7000,happy:20},
];
const JOBS={
  franquia:{n:'Dentista CLT em franquia popular',h:30,pay:4500,d:'Salário fixo, carteira assinada.',req:()=>true},
  plantao:{n:'Plantão de urgência noturno',h:12,pay:2600,d:'Vaga sempre aberta.',req:()=>true},
  publico:{n:'Cargo público (concursado)',h:20,pay:7000,d:'Estável. Só com aprovação em concurso.',req:s=>!!s.flags.concurso,rq:'Passe em um concurso'},
  professor:{n:'Professor universitário',h:16,pay:8500,payF:s=>s.specs.posdoc?17000:s.specs.doutorado?13500:8500,d:'Salário maior com doutorado e pós-doc.',req:s=>!!s.specs.mestrado&&s.rep>=35,rq:'Mestrado + reputação 35'},
  palestras:{n:'Palestras e cursos para colegas',h:6,pay:0,payF:s=>2000+s.rep*160+(s.specs.doutorado?4000:0)+(s.specs.fellow?5000:0),d:'Congressos e cursos práticos.',req:s=>(!!s.specs.doutorado||espCount(s)>=3)&&s.rep>=50,rq:'Doutorado ou 3 especializações + reputação 50'},
};

function hours(s){let h=s.cliH+s.terH+bizHours(s);for(const k in JOBS)if(s.jobs[k])h+=JOBS[k].h;
  for(const c of studying(s))h+=COURSES[c.k].h; if(s.franq.on&&!s.gestor)h+=10; return h;}
function chairsFree(s){const C=CLINIC[s.clinic.level];return C.chairs-(s.cliH>0?1:0)-s.assoc.length;}
function debtPay(s){let p=0;for(const x of s.props)p+=x.pay||0;for(const l of s.loans)p+=l.pay;if(s.houseLoan)p+=s.houseLoan.pay;return p;}
function pmt(L,r,n){return L*r/(1-Math.pow(1+r,-n));}
function royalty(s){return 4000+s.rep*90;}
function bizVal(b){return b.st==='ok'?b.profit*30*(b.ges?1:0.8):b.st==='inc'?b.inv*0.5:0;}
function clinicEq(s){let c=0;for(let i=1;i<=s.clinic.level;i++)c+=CLINIC[i].cost;return c*0.4+Math.max(0,s.lastClinic||0)*12;}
function netWorth(s){
  let n=s.cash;for(const k in s.inv)n+=s.inv[k];
  for(const p of s.props)n+=p.value-p.loan;
  for(const b of s.biz)n+=bizVal(b);
  n+=clinicEq(s)+s.houseVal+s.carVal;
  if(s.houseLoan)n-=s.houseLoan.bal;
  for(const l of s.loans)n-=l.bal;
  if(s.franq.on)n+=s.franq.units*royalty(s)*30;
  return n;
}

function calc(s,live){
  const L={inc:[],exp:[],passive:0,active:0,tax:0,net:0,reinv:0,occ:0,demand:0,sup:0,clinicNet:0,evade:0,taxDefer:0};
  const inc=(n,v,pas,reinv)=>{if(v>0.5)L.inc.push({n,v,pas:!!pas,reinv:!!reinv})};
  const exp=(n,v)=>{if(v>0.5)L.exp.push({n,v})};
  const rate=ownRate(s),off=s.off>0,cr=s.macro.crisis>0,lk=s.macro.lockdown>0;
  const rr=live?()=>rand(0.88,1.12):()=>1;
  let jobs=0;for(const k in JOBS)if(s.jobs[k])jobs+=jobPay(s,k);
  if(off&&s.offKind!=='ferias')jobs*=0.6;
  inc('Salários e empregos',jobs);
  if(off&&s.ins.dit&&s.offKind!=='ferias')inc('Seguro DIT pagando seu afastamento',(s.ditBase||0)*0.7);
  const sm=s.shiftMult!=null?s.shiftMult:autoMult(s);
  const ter=(off||lk)?0:s.terH*4.3*rate*0.4*rr()*(cr?0.75:1)*sm;
  inc('Atendimentos em clínicas de terceiros (40%)',ter);
  let clinicNet=0,clinicPassive=false,clinicGross=0;
  if(s.clinic.level>0){
    const lv=s.clinic.level,C=CLINIC[lv],M=MKT[s.clinic.mkt],P=PRICE[s.g.preco],MT=MAT[s.g.mat],RB=RECEB[s.g.receb];
    const ownSup=off?0:s.cliH*4.3,aSup=s.assoc.length*140,sup=ownSup+aSup;
    const pd=P.d+(P.r>1?s.rep/100*(P.r-1)*0.9:0);
    let dem=(30+s.rep*4+M.d+specSum(s,'dem',0))*C.vis*pd*(s.stain>0?(P.r>1?0.6:0.8):1)*RB.d*(s.convenio?1.4:1)*(cr?0.7:1)*(s.raioxOff>0?0.85:1)*rr();
    if(lk||s.closed>0)dem=0;
    const occ=sup>0?Math.min(1,dem/sup):0;
    const noShow=s.g.confirm?0.07:0.22,realized=1-noShow*0.6;
    const rm=(s.convenio?0.85:1)*P.r;
    const own=ownSup*occ*realized*rate*rm*sm;
    let aRev=0;for(const a of s.assoc)aRev+=140*occ*realized*a.rate*rm;
    clinicGross=own+aRev;
    const share=aRev*0.5,used=(ownSup>0?1:0)+s.assoc.length;
    const fixed=C.fixed*specSum(s,'fix',1)*(s.gestor?0.9:1);
    const asb=used*(s.g.registro?2600:1700),ges=s.gestor?12000:0,labC=clinicGross*(s.g.lab==='barato'?0.015:0.03),manC=s.g.manut?150+lv*200:0;
    const matC=clinicGross*MT.c,fee=clinicGross*RB.fee,calote=clinicGross*RB.bad;
    const lic=licCost(s),conf=s.g.confirm?300+lv*250:0,tcle=s.g.tcle?150+lv*80:0;
    const struct=fixed+asb+M.c+ges+lic+conf+tcle+manC;
    clinicNet=own+share-struct-matC-fee-calote-labC;
    clinicPassive=s.cliH===0&&s.gestor;
    inc('Sua produção na clínica',own);
    inc('Repasse dos associados (50%)',share,clinicPassive);
    exp('Aluguel, energia e custos fixos da clínica',fixed);exp('Auxiliares de saúde bucal'+(s.g.registro?'':' (sem registro)'),asb);exp('Laboratório de prótese',labC);exp('Manutenção preventiva',manC);exp('Marketing: '+M.n,M.c);
    exp('Gestor da clínica',ges);exp('Material de consumo ('+MT.n.toLowerCase()+')',matC);exp('Taxas da maquininha',fee);
    exp('Inadimplência de pacientes',calote);exp('Licenças e documentação',lic);exp('Confirmação de consultas',conf);exp('Prontuário digital e TCLE',tcle);
    const capH=C.chairs*160;
    Object.assign(L,{occ,demand:dem,sup,noShow,lostH:sup*occ*noShow*0.6,horaCusto:(struct)/Math.max(1,capH),horaRec:rate*rm,horaVar:MT.c+RB.fee+RB.bad+(s.g.lab==='barato'?0.015:0.03),ocio:1-occ});
  }
  L.clinicNet=clinicNet;L.clinicPassive=clinicPassive;
  // impostos
  let fullTax;
  if(s.g.pj){fullTax=(ter+(clinicPassive?0:Math.max(0,clinicGross)))*0.085+Math.max(0,jobs-3000)*0.15;exp('Contador da PJ',1500);}
  else{const taxable=jobs+ter+(clinicPassive?0:Math.max(0,clinicNet));const prevDed=Math.min(s.prevMensal,taxable*0.12);fullTax=Math.max(0,taxable-prevDed-3000)*0.2;}
  let tax=fullTax*(s.sonegar?0.5:1);
  L.evade=fullTax-tax;
  if(s.g.atrasar){L.taxDefer=tax;tax=0;}
  L.tax=tax;
  let pas=0;
  const rfY=s.inv.rf*0.005;L.reinv=rfY;inc('Juros da renda fixa (reinvestidos)',rfY,1,1);pas+=rfY;
  const fd=s.inv.fii*0.0065,ad=s.inv.acoes*0.003;inc('Dividendos de FIIs',fd,1);inc('Dividendos de ações',ad,1);pas+=fd+ad;
  let rent=0,rentInt=0,rentPay=0,rentTax=0;
  for(const p of s.props){const g=p.vac>0?0:p.value*PROP[p.t].y;const net=g*0.9;const tx=p.h?g*0.1133:net*0.2;rent+=net;rentTax+=tx;rentInt+=p.loan*0.009;if(p.loan>0)rentPay+=p.pay;}
  inc('Aluguéis recebidos (menos manutenção)',rent,1);exp('IR sobre aluguéis',rentTax);pas+=rent-rentTax-rentInt;
  let bizA=0,bizP=0;
  for(const b of s.biz)if(b.st==='ok'){const v=b.profit*(live?rand(0.8,1.2):1)*(cr?0.8:1);if(b.ges)bizP+=v*0.82;else bizA+=v;}
  inc('Lucro dos negócios (você gerencia)',bizA);inc('Lucro dos negócios (com gestor)',bizP,1);pas+=bizP;
  if(s.franq.on){const roy=s.franq.units*royalty(s),c=25000+s.franq.units*1500;inc('Royalties de franquias',roy,1);exp('Estrutura da franqueadora',c);pas+=roy-c;}
  if(clinicPassive)pas+=clinicNet;
  if(age(s)>=55){const pr=s.inv.prev*0.005;inc('Renda da previdência',pr,1);pas+=pr;}
  exp(s.g.pj?'Impostos (Simples Nacional + IR do salário)':'Impostos (IR / carnê-leão)',tax);
  exp('Seguros',insCost(s));
  if(s.holding)exp('Holding patrimonial (contabilidade)',1200);
  exp('Custo de vida básico',2200);exp('Moradia: '+HOUSE[s.house].n,HOUSE[s.house].cost);exp('Transporte: '+CAR[s.car].n,CAR[s.car].cost);
  exp('Financiamentos de imóveis',rentPay);
  if(s.houseLoan)exp('Financiamento da sua casa',s.houseLoan.pay);
  for(const c of studying(s)){const C=COURSES[c.k];exp('Estudos: '+C.n,C.cost/C.m);}
  for(const l of s.loans)exp('Empréstimo: '+l.n,l.pay);
  if(s.prevMensal>0)exp('Aporte na previdência',s.prevMensal);
  for(const b of s.biz)if(b.st==='inc'||b.st==='scale')exp('Capital de giro: '+BIZ[b.t].n,b.burn||0);
  if(s.cash<0)exp('Juros do cheque especial (8% a.m.)',-s.cash*0.08);
  const ti=L.inc.reduce((a,x)=>a+(x.reinv?0:x.v),0),te=L.exp.reduce((a,x)=>a+x.v,0);
  L.net=ti-te;L.passive=pas;L.active=jobs+ter+bizA+(clinicPassive?0:clinicNet);L.hours=hours(s);L.rate=rate;
  return L;
}

function seize(s,why){
  if(s.cash>=0)return '';
  const sold=[];
  if(!s.holdInv)for(const k of ['rf','fii','acoes','cripto']){if(s.cash>=0)break;if(s.inv[k]>0){const take=Math.min(s.inv[k],-s.cash/0.95);s.inv[k]-=take;s.cash+=take*0.95;sold.push(INV[k].n);}}
  while(s.cash<0){const p=s.props.find(p=>!p.h);if(!p)break;s.cash+=p.value*0.7-p.loan;s.props=s.props.filter(x=>x!==p);sold.push(PROP[p.t].n+' (leilão)');}
  if(!sold.length)return '';
  pen(s,150*sold.length,'bens penhorados');log(s,`Penhora (${why}): ${sold.join(', ')}.`,'bad');
  return ` A Justiça penhorou: ${sold.join(', ')}.`;
}
function exposure(s){let e=Math.max(0,s.cash);if(!s.holdInv)e+=s.inv.rf+s.inv.fii+s.inv.acoes+s.inv.cripto;for(const p of s.props)if(!p.h)e+=Math.max(0,p.value-p.loan);return e;}
function insList(s){return Object.keys(INS).filter(k=>!INS[k].need||INS[k].need(s));}
function protTotal(s){return insList(s).length+4;}
function protCount(s){return insList(s).filter(k=>s.ins[k]).length+(s.g.pj?1:0)+(s.holding?1:0)+(s.pacto?1:0)+(s.reserva?1:0);}
function resMonths(L){const ex=L.exp.reduce((a,x)=>a+x.v,0);return ex>0?S.inv.rf/ex:0;}

  lesao:{b:(s,d)=>({t:'Lesão no punho (LER)',k:'bad',x:`Anos de postura ruim cobraram: tendinite grave. São 3 meses sem atender.${s.ins.dit?' Seu seguro DIT paga 70% da sua renda nesse período.':' Você não tem seguro de invalidez (DIT).'}`,c:[{l:'Tratar',f:s=>{s.off=3;s.offKind='lesao';pen(s,100,'afastamento por lesão');return null;}}]})},

/* ============ passo mensal ============ */
function tick(){
  const s=S,ev=evm(s);
  const L=calc(s,true);s.shiftMult=null;
  s.cash+=L.net;s.inv.rf+=L.reinv;s.taxDebt=(s.taxDebt||0)*1.01+L.taxDefer;if(s.off===0)s.ditBase=(s.ditBase||0)*0.85+Math.max(0,L.active)*0.15;if(s.raioxOff>0)s.raioxOff--;if(s.stain>0)s.stain--;
  if(s.reserva&&s.cash<0&&s.inv.rf>0){const w=Math.min(s.inv.rf,-s.cash+2000);s.inv.rf-=w;s.cash+=w;}s.inv.prev+=s.prevMensal;s.evaded+=L.evade;s.lastNet=L.net;s.lastClinic=L.clinicNet;
  if(age(s)>=55)s.inv.prev*=0.995;
  for(const p of s.props)if(p.loan>0){const i=p.loan*0.009;p.loan-=p.pay-i;if(p.loan<1){p.loan=0;p.pay=0;}}
  if(s.houseLoan){const h=s.houseLoan;h.bal-=h.pay-h.bal*0.009;if(h.bal<1)s.houseLoan=null;}
  s.loans=s.loans.filter(l=>{l.bal-=l.pay-l.bal*l.r;return l.bal>1;});
  if(s.auto.pct>0&&L.net>0&&s.cash>0){const a=Math.min(s.cash,L.net*s.auto.pct/100);s.cash-=a;s.inv[s.auto.dest]+=a;}
  // mercado
  const cr=s.macro.crisis>0;
  s.inv.fii*=1+0.001+randn()*0.025-(cr?0.012:0);
  s.inv.acoes*=1+0.007+randn()*0.055-(cr?0.02:0);
  s.inv.cripto*=Math.max(0.2,1+0.012+randn()*0.17);
  s.inv.prev*=1.0055;
  if(s.inv.piramide>0)s.inv.piramide*=1.05;
  for(const p of s.props){p.value*=1+0.001+randn()*0.004;if(p.vac>0)p.vac--;else if(R()<0.025){p.vac=Math.ceil(rand(1,4));log(s,`${PROP[p.t].n} ficou vago por ${p.vac} ${p.vac>1?'meses':'mês'}.`);}}
  if(s.house>=2)s.houseVal*=1.001;
  s.carVal*=0.99;
  // cursos
  for(const tr in s.study){const c=s.study[tr];if(!c)continue;const C=COURSES[c.k];s.eduSpent+=C.cost/C.m;c.left--;
    if(c.left<=0){
      if(tr!=='imersao'&&s.energy<30&&R()<0.4){c.left=tr==='acad'?6:3;pen(s,60,'reprovação na banca');q(s,'banca',{n:C.n,m:c.left,tr});continue;}
      s.specs[c.k]=true;s.skill=Math.min(100,s.skill+C.skill);s.rep+=C.rep||0;s.study[tr]=null;
      log(s,`Você concluiu ${C.n}!`,'good');bon(s,tr==='imersao'?30:tr==='acad'?250:100,(tr==='acad'?'título: ':'curso concluído: ')+C.n);
      if(tr!=='imersao')q(s,'formatura',{n:C.n,tr,k:c.k});
    }}
  // negócios
  for(const b of s.biz){
    if((b.st==='inc'||b.st==='scale')&&--b.left<=0){
      const B=BIZ[b.t];
      if(b.st==='inc'){
        const p=clamp(B.p+B.bonus(s)+(s.specs.mba?0.12:0)-(ev-1)*0.08,0.03,0.92);
        if(R()<p){b.st='ok';b.profit=Math.round(rand(B.min,B.max));q(s,'bizRes',{ok:1,n:B.n,p:b.profit});}
        else{b.st='dead';const extra=R()<0.4?Math.round(b.inv*rand(0.1,0.3)):0;s.cash-=extra;pen(s,500,'negócio faliu');q(s,'bizRes',{ok:0,n:B.n,extra});}
      }else{
        if(R()<0.6+(s.specs.mba?0.1:0)-(ev-1)*0.06){b.profit=Math.round(b.profit*2.1);b.lv++;b.st='ok';q(s,'scaleRes',{ok:1,n:B.n,p:b.profit});}
        else{b.profit=Math.round(b.profit*0.85);b.st='ok';pen(s,250,'expansão fracassada');q(s,'scaleRes',{ok:0,n:B.n});}
      }
    }
  }
  // franquias
  if(s.franq.on){
    for(let i=0;i<s.franq.pace;i++)if(R()<clamp(s.rep/140,0.05,0.85)){s.franq.units++;s.cash+=50000;}
    let lost=0;for(let i=0;i<s.franq.units;i++)if(R()<0.008)lost++;
    if(lost){s.franq.units-=lost;s.rep-=lost*0.5;log(s,`${lost} franquia(s) fechou(fecharam).`,'bad');}
    if(s.franq.units>0&&R()<s.franq.units*0.003*ev){s.rep-=3;pen(s,150,'escândalo em franquia');q(s,'franqEsc');}
  }
  // associados
  for(const a of s.assoc){a.q=clamp(a.q+0.002,0,0.97);}
  // atributos
  const H=hours(s),clinical=s.cliH+s.terH+(s.jobs.franquia?30:0)+(s.jobs.plantao?12:0)+(s.jobs.publico?20:0);
  if(s.off>0){s.energy+=25;s.off--;}
  else s.energy+=(46-H)*0.55+HOUSE[s.house].happy*0.06;
  s.energy=clamp(s.energy,0,100);
  if(s.off===0)s.skill=Math.min(s.skill<85?100:100,s.skill+clinical*0.0045*(s.skill<85?1:0.3));
  let dr=(clinical>0?0.1:0)+s.clinic.mkt*0.08+(s.skill-45)/500+s.clinic.level*0.04+(s.jobs.professor?0.15:0);
  s.rep=clamp(s.rep+dr,0,100);
  const tgtH=38+HOUSE[s.house].happy+CAR[s.car].happy+(s.energy-50)*0.25-(H>55?12:0)-(s.cash<0?10:0);
  s.happy=clamp(s.happy+(tgtH-s.happy)*0.12,0,100);
  s.lowHappy=s.happy<22?s.lowHappy+1:Math.max(0,s.lowHappy-1);
  if(s.closed>0)s.closed--;
  settleAgenda(s);
  trackRisks(s);
  // timers
  const due=s.timers.filter(t=>t.at<=s.m+1);s.timers=s.timers.filter(t=>t.at>s.m+1);
  for(const t of due)q(s,t.id,t.d);
  // eventos aleatórios
  rollEvents(s,ev,clinical);
  if(s.macro.crisis>0)s.macro.crisis--;
  if(s.macro.lockdown>0)s.macro.lockdown--;
  // candidatos
  if(s.clinic.level>0)s.cand=makeCands(s);
  s.m++;
  // liquidação
  checkDebt(s);
  // histórico, conquistas, metas
  const nw=netWorth(s),pas=calc(s,false).passive;
  if(s.m%3===0)s.hist.push([s.m,Math.round(nw),Math.round(pas)]);
  achCheck(s,nw,pas);
  goalCheck(s,nw,pas);
}
function rollEvents(s,ev,clinical){
  if(s.energy<10&&s.off===0){q(s,'burnout',{expl:`Nos últimos meses você trabalhou ${hours(s)}h por semana. Acima de 46h a energia cai mês a mês até o corpo parar.`});return;}
  if(s.lowHappy>=10&&!s.flags.crisePessoal){s.flags.crisePessoal=s.m;q(s,'crisePessoal',{expl:'Sua felicidade ficou baixa por quase um ano seguido: muitas horas de trabalho, pouco descanso e pouca vida fora da clínica.'});}
  const procs=['coroa','restauração','endodontia','prótese','faceta','extração'],pacs=['Seu Antônio','Dona Cida','a Júlia','o Marcos','a Dona Neide','o Rodrigo'];
  if(s.off===0&&R()<(s.clinic.level>0?MAT[s.g.mat].e:1)*(1-s.skill/115)*0.07*ev*Math.max(0.5,1-espCount(s)*0.06)*Math.min(1.6,clinical/40))q(s,'retrab',{proc:pick(procs),pac:pick(pacs)});
  for(const a of s.assoc){
    if(R()<(1-a.q)*0.07*ev*MAT[s.g.mat].e){q(s,'assocErr',{id:a.id,nome:a.nome,cost:Math.round(rand(3000,14000))});break;}
  }
  if(s.assoc.length&&R()<0.008*s.assoc.length){const a=pick(s.assoc);s.assoc=s.assoc.filter(x=>x!==a);s.rep-=1;log(s,`${a.nome} saiu e levou alguns pacientes.`,'bad');}
  if(s.clinic.level>0&&R()<0.008*ev)q(s,'equip',{eq:pick(['compressor','autoclave','raio-x','motor de implante','cadeira odontológica']),cost:Math.round(rand(3000,12000)*(1+s.clinic.level*0.5))});
  const lv=s.clinic.level;
  if(lv>0&&R()<0.004)q(s,'lab',{cost:Math.round(rand(1500,4000))});
  if(lv>0&&s.g.receb==='carne'&&R()<0.02)q(s,'inadimp',{v:Math.round(rand(8000,22000))});
  if(lv>0&&!s.g.confirm&&s.cliH>0&&R()<0.015)q(s,'faltas',{n:Math.round(rand(7,14))});
  if(lv>=2&&R()<0.0015*ev)q(s,'trabalhista',{v:Math.round(rand(15000,40000))});
  if(lv>0&&R()<0.002)q(s,'incendio');
  if(s.off===0&&clinical>30&&R()<0.003)q(s,'lesao');
  if(s.taxDebt>15000&&R()<0.04*ev){const r=(s.risks||[]).find(x=>x.k==='atraso');q(s,'dividaAtiva',{v:Math.round(s.taxDebt*1.2),expl:r?explain(r):''});}
  if(lv>0&&s.clinic.mkt>=2&&R()<0.006*ev*(s.specs.im_marketing?0.3:1))q(s,'croMkt');
  if(R()<0.002*ev*(1+s.clinic.level*0.4))q(s,'processo',{});
  if(!s.macro.crisis&&R()<0.008*ev){s.macro.crisis=Math.ceil(rand(8,14));s.inv.acoes*=0.75;s.inv.fii*=0.88;s.inv.cripto*=0.55;for(const p of s.props)p.value*=0.95;q(s,'crise');}
  if(R()<0.008){s.inv.acoes*=1.18;s.inv.cripto*=1.6;if(s.inv.acoes+s.inv.cripto>1000)q(s,'boom');}
  if(!s.flags.pandemia&&s.m>36&&R()<0.004){s.flags.pandemia=1;s.macro.lockdown=3;s.inv.acoes*=0.7;q(s,'pandemia');}
  if((s.clinic.level>0||s.terH>0)&&R()<0.012)q(s,'influencer',{pac:pick(['@bia.fitness','@dramarcela','@chefdudu','@luana.viaja'])});
  if(s.cash>60000&&R()<0.008*ev)q(s,'socio',{v:Math.round(Math.min(s.cash*0.5,rand(50000,150000))/1000)*1000});
  if(s.cash>20000&&!s.inv.piramide&&R()<0.008*ev)q(s,'piramide',{v:Math.round(s.cash*0.4/1000)*1000});
  if(s.props.length&&R()<0.006*ev*Math.min(5,s.props.length)){const p=pick(s.props);if(!(p.vac>0)){if(s.ins.fianca)log(s,`Inquilino do imóvel ${PROP[p.t].n} deu calote. O seguro fiança pagou tudo.`,'good');else q(s,'calote',{id:p.id,t:p.t});}}
  if(s.props.length&&R()<0.008){const p=pick(s.props);p.value*=1.15;q(s,'valoriza',{t:p.t});}
  if(!s.flags.concurso&&s.m<180&&R()<0.012)q(s,'concurso');
  if(s.clinic.level>0&&!s.convenio&&R()<0.012)q(s,'convenio');
  if(s.car>0&&R()<0.01)q(s,'assalto',{cost:Math.round(Math.max(3000,s.carVal*0.08))});
  if(R()<0.0015)q(s,'heranca',{v:Math.round(rand(30000,150000)/1000)*1000});
  const ok=s.biz.filter(b=>b.st==='ok'&&BIZ[b.t]);if(ok.length&&R()<0.01)q(s,'oferta',{id:pick(ok).id});
  if(s.specs.implante&&s.clinic.level>0&&R()<0.015)q(s,'vip');
  if(s.specs.hof&&R()<0.012*ev)q(s,'hofComp');
  if(s.study.acad&&R()<0.03)q(s,'artigo');
  if(s.rep>=45&&espCount(s)+(s.specs.doutorado?2:0)>=3&&R()<0.012)q(s,'congresso',{v:8000+Math.round(s.rep*100)});
  if(s.specs.bucomaxilo&&s.clinic.level>0&&R()<0.012)q(s,'trauma');
  if(studying(s).length>=2&&s.energy<35&&R()<0.05)q(s,'sobrecarga');
}
/* escolhas arriscadas: o problema só aparece meses depois, e aí vem a explicação */
const RMUL={alvara:{t:'Fiscal da prefeitura',x:'A prefeitura fiscalizou e a clínica estava sem alvará e com ISS atrasado.',f:[5000,25000],cl:0.4},
  sanitaria:{t:'Vigilância Sanitária na porta',x:'A fiscalização encontrou falhas de biossegurança e esterilização.',f:[8000,30000],cl:0.7,rep:3},
  pgrss:{t:'Multa ambiental',x:'Resíduos de saúde da clínica foram achados no lixo comum.',f:[12000,30000],cl:0,rep:2},
  rt:{t:'Fiscalização do CRO',x:'A clínica funcionava sem registro no CRO e sem responsável técnico declarado.',f:[5000,12000],cl:0,rep:3},
  raiox:{t:'Raio-x lacrado',x:'O raio-x estava sem laudo radiométrico e foi lacrado por 3 meses. Pacientes foram para outra clínica.',f:[10000,20000],cl:0,raiox:1},
  avcb:{t:'Bombeiros interditaram',x:'Sem AVCB, extintores vencidos e sem saída de emergência sinalizada.',f:[8000,40000],cl:0.5}};
const RISK={
  mat:{why:'você escolheu comprar material odontológico econômico',on:s=>s.clinic.level>0&&s.g.mat===0,p:0.04},
  lab:{why:'você trocou para o laboratório de prótese mais barato',on:s=>s.clinic.level>0&&s.g.lab==='barato',p:0.035},
  informal:{why:'você contratou auxiliares sem carteira assinada',on:s=>s.clinic.level>0&&!s.g.registro,p:0.025},
  sonegar:{why:'você passou a emitir recibo de só parte dos atendimentos',on:s=>s.sonegar,p:0.03},

  usados:{why:'você equipou a clínica com aparelhos usados, sem procedência',on:s=>s.clinic.level>0&&s.equipUsed,p:0.03},
  manut:{why:'você não contratou manutenção preventiva dos equipamentos',on:s=>s.clinic.level>0&&!s.g.manut,p:0.025},
  popular:{why:'você aceitou trabalhar como CLT na franquia popular por R$ 4.500',on:s=>s.jobs.franquia,p:0.04,min:10},

for(const k in LIC)RISK['lic_'+k]={why:`você deixou de pagar: ${LIC[k].n.toLowerCase()}`,on:s=>s.clinic.level>=LIC[k].min&&!s.lic[k],p:0.02,lic:k};
function explain(r){return `Em ${dateL(r.since)}${r.until!=null?` (e até ${dateL(r.until)})`:''}, ${RISK[r.k].why}. Pareceu economia na hora. A conta chegou agora.`;}
function trackRisks(s){
  if(!s.risks)s.risks=[];
  for(const k in RISK){const on=RISK[k].on(s),r=s.risks.find(x=>x.k===k&&x.until==null);
    if(on&&!r)s.risks.push({k,since:s.m,until:null,cd:0});if(!on&&r)r.until=s.m;}
  const lv=s.clinic.level;
  for(const r of shuffle(s.risks)){const Rk=RISK[r.k];if(!Rk.p||s.m-r.since<(Rk.min||4)||r.cd>s.m||(r.k==='popular'&&s.stain>0))continue;
    const exp=(r.until==null?s.m:r.until)-r.since,decay=r.until==null?1:Math.max(0,1-(s.m-r.until)/36);
    if(R()>=Rk.p*evm(s)*Math.min(1.6,0.3+exp/12)*decay)continue;
    r.cd=s.m+8;const expl=explain(r);log(s,"Consequência tardia: "+expl,"bad");
    if(Rk.lic){const m=RMUL[Rk.lic];q(s,'multa',{t:m.t,x:m.x,fine:Math.round(rand(m.f[0],m.f[1])*(1+lv*0.3)),closed:R()<m.cl?1:0,raiox:m.raiox,rep:m.rep,lic:Rk.lic,why:'multa: '+LIC[Rk.lic].n,expl});}
    else if(r.k==='mat'){const cons=pick(['coroa','coroa','endo']);q(s,'retratar',{cons,pac:pick(NAMES)+' '+pick(SUR),cost:Math.round(PROCS[CONS[cons].k].v*1.2),expl});}
    else if(r.k==='lab')q(s,'lab',{cost:Math.round(rand(3000,9000)),expl});
    else if(r.k==='informal')q(s,'trabalhista',{v:Math.round(rand(25000,70000)),informal:1,expl});
    else if(r.k==='sonegar')q(s,'malha',{ev:Math.max(s.evaded,8000),expl});
    else if(r.k==='usados')q(s,'multa',{t:'A autoclave usada falhou',x:'O teste biológico mostrou que a autoclave comprada usada não esterilizava direito. A Vigilância interditou a clínica e você precisou convocar pacientes para exames.',fine:Math.round(rand(15000,35000)*(1+lv*0.3)),closed:1,rep:4,why:'equipamento usado sem procedência',pts:400,expl});
    else if(r.k==='manut')q(s,'equip',{eq:pick(['compressor','autoclave','raio-x','motor de implante','cadeira odontológica']),cost:Math.round(rand(6000,18000)*(1+lv*0.5)),expl});
    else if(r.k==='popular')q(s,'mancha',{expl:`Em ${dateL(r.since)}, você aceitou trabalhar como CLT na franquia popular por R$ 4.500. Isso marcou sua imagem: pacientes de classe média alta passaram a ligar o seu nome a atendimento barato. Vai levar uns 2 anos para recuperar. E R$ 4.500 você fatura com 1 ou 2 implantes, em uma ou duas horas de trabalho.`});
    else if(r.k==='tcle')q(s,'processo',{why:'um paciente que diz não ter sido informado dos riscos',expl});
    break;}
  s.risks=s.risks.filter(r=>r.until==null||s.m-r.until<36);
}
function checkDebt(s){
  const lim=-(30000+0.1*Math.max(0,netWorth(s)));
  if(s.cash>=lim)return;
  const sold=[];
  for(const k of (s.holdInv?['piramide']:['cripto','acoes','fii','rf','piramide'])){if(s.cash>=0)break;if(s.inv[k]>0){s.cash+=s.inv[k]*0.95;sold.push(INV[k]?INV[k].n:k);s.inv[k]=0;}}
  while(s.cash<0&&s.biz.some(b=>b.st==='ok')){const b=s.biz.find(b=>b.st==='ok');s.cash+=bizVal(b)*0.5;s.biz=s.biz.filter(x=>x!==b);sold.push(BIZ[b.t]?BIZ[b.t].n:'sociedade');}
  while(s.cash<0&&s.props.some(p=>!p.h)){const p=s.props.find(p=>!p.h);s.props=s.props.filter(x=>x!==p);s.cash+=p.value*0.75-p.loan;sold.push(PROP[p.t].n);}
  if(s.cash<0&&s.car>0){s.cash+=s.carVal*0.8;s.car=0;s.carVal=0;sold.push('carro');}
  if(s.cash<0&&s.house>=2){s.cash+=s.houseVal*0.75-(s.houseLoan?s.houseLoan.bal:0);s.house=0;s.houseVal=0;s.houseLoan=null;sold.push('sua casa');}
  while(s.cash<0&&s.clinic.level>0){const C=CLINIC[s.clinic.level];s.cash+=C.cost*0.3;s.clinic.level--;sold.push(C.n+' (passou o ponto)');
    const ch=CLINIC[s.clinic.level].chairs;if(s.clinic.level===0){s.assoc=[];s.gestor=false;s.cliH=0;s.convenio=false;s.franq={on:false,units:0,pace:0};}else s.assoc=s.assoc.slice(0,Math.max(0,ch-(s.cliH>0?1:0)));}
  if(sold.length){pen(s,300*sold.length,'bens vendidos à força');q(s,'liquid',{sold:sold.join(', ')});}
  if(s.cash<lim){
    if(!s.flags.reneg||s.m-s.flags.reneg>24){const bal=-s.cash;s.loans.push({n:'Renegociação bancária',bal,pay:pmt(bal,0.025,48),r:0.025});s.cash=0;s.flags.reneg=s.m;pen(s,500,'renegociação de dívida');q(s,'reneg',{v:bal});return;}
  }
  if(s.cash<lim){const last=[];for(const k of ['rf','fii','acoes','cripto']){if(s.inv[k]>0){s.cash+=s.inv[k]*0.95;s.inv[k]=0;last.push(INV[k].n);}}
    while(s.cash<0&&s.props.length){const p=s.props.pop();s.cash+=p.value*0.75-p.loan;last.push(PROP[p.t].n+' da holding');}
    if(last.length){pen(s,300,'venda do patrimônio protegido');q(s,'liquid',{sold:last.join(', ')});}}
  if(s.cash<lim&&!s.props.length&&s.clinic.level===0){s.dead=true;s.over=true;pen(s,2000,'falência');s.queue=[{id:'falencia',d:{}}];}
}
function achCheck(s,nw,pas){

function goals(s,nw,pas){
  const G=DIFF[s.diff].g;if(nw===undefined)nw=netWorth(s);if(pas===undefined)pas=calc(s,false).passive;
  const a=[{n:'Renda passiva por mês',c:pas,t:G.passive,m:1},{n:'Patrimônio líquido',c:nw,t:G.nw,m:1}];

function goalCheck(s,nw,pas){
  if(s.over)return;

}

function eqF(){return S.g.equip==='usado'?0.7:1;}

/* ============ modal ============ */
function openModal(){
  const o=$('#ovl');let m=null;
  if(notice)m=notice;
  else if(S&&S.queue.length){const e=S.queue[0],B=EV[e.id];if(!B){S.queue.shift();return openModal();}m=B.b(S,e.d);m.ev=true;S.queue[0].built=m;}
  if(!m){o.hidden=true;o.innerHTML='';return;}
  const ch=m.c||[{l:'Entendi',f:()=>null}];
  const ex=!notice&&S&&S.queue[0]&&S.queue[0].d&&S.queue[0].d.expl;
  o.innerHTML=`<div class="ov"><div class="modal ${m.k==='bad'?'badm':m.k==='good'?'goodm':''}" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${esc(m.t)}</h2><p>${esc(m.x)}</p>${ex?`<div class="tip"><b>Por que isso aconteceu?</b> ${esc(ex)}</div>`:''}
    <div class="choices">${ch.map((c,i)=>`<button class="btn ${i===0?'gold':''}" data-ch="${i}">${esc(c.l)}</button>`).join('')}</div></div></div>`;
  o.hidden=false;
  const b=o.querySelector('[data-ch]');if(b)b.focus();
  o.querySelectorAll('[data-ch]').forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.ch,c=ch[i];let res=null;
    if(notice){notice=null;res=c.f?c.f(S):null;}
    else{S.queue.shift();res=c.f(S);}
    if(!S){return;}
    S.rep=clamp(S.rep,0,100);
    if(res){notice={t:m.t,x:res,k:m.k,c:[{l:'Continuar',f:()=>null}]};}
    save();render();openModal();
  });

function chartSVG(){
  const h=S.hist;if(h.length<2)return '<p class="mute">O gráfico aparece depois de alguns meses de jogo.</p>';
  const W=560,H=200,pl=58,pb=22,pt=10,mx=Math.max(1,...h.map(x=>x[1]),DIFF[S.diff].g.nw),mn=Math.min(0,...h.map(x=>x[1])),mm=h[h.length-1][0]||1;
  const X=m=>pl+(W-pl-8)*m/mm,Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const pts=h.map(x=>`${X(x[0]).toFixed(1)},${Y(x[1]).toFixed(1)}`).join(' ');
  const g=DIFF[S.diff].g.nw,ticks=[mn,(mx+mn)/2,mx];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Patrimônio ao longo do tempo">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-8}" y1="${Y(t)}" y2="${Y(t)}" class="grid" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(t)+4}" class="lab" font-size="11" text-anchor="end">${money(t).replace('R$ ','')}</text>`).join('')}
    <line x1="${pl}" x2="${W-8}" y1="${Y(g)}" y2="${Y(g)}" class="goalln" stroke-width="1.5"/><text x="${W-10}" y="${Y(g)-5}" class="goalt" font-size="11" text-anchor="end">meta</text>
    <polygon points="${X(h[0][0])},${Y(mn)} ${pts} ${X(h[h.length-1][0])},${Y(mn)}" class="area"/>
    <polyline points="${pts}" fill="none" class="ln" stroke-width="2.5"/>
    <circle cx="${X(h[h.length-1][0])}" cy="${Y(h[h.length-1][1])}" r="4" class="dot"/>
    <text x="${pl}" y="${H-5}" class="lab" font-size="11">${dateL(0)}</text><text x="${W-8}" y="${H-5}" class="lab" font-size="11" text-anchor="end">${dateL(mm)}</text></svg>`;
}

function shBars(){const c=$('#clk');if(c)c.textContent=clockL(SH.t);const d=$('#db');if(d)d.style.width=(SH.t/SH.dur*100)+'%';

  const ks=Object.keys(PROCS).filter(k=>k!==w.c.t&&k!=='manutOrto'),others=[...shuffle(ks.filter(k=>procOK(S,k))),...shuffle(ks.filter(k=>!procOK(S,k)))].slice(0,2);

function shLoop(ts){
  if(!SH||SH.phase!=='play')return;

  for(const p of SH.pats){if(p.st==='agenda'&&SH.t>=p.arr){p.st='espera';ch=true;}
    if(p.st==='espera'){p.pat-=dt*(SH.asb?0.85:1);if(p.pat<=0){p.st='perdido';SH.lost++;shMsg(`${esc(p.nome)} cansou de esperar e foi embora.`,'bad');ch=true;}}}

    if(cur&&cur.stage==='steps'){cur.tl-=dt;if(cur.tl<=0){shFinal(true);ch=true;}}}

function addRes(t,k){SH.res.push({h:clockL(SH.t),t,k:k||''});}
function shFinal(timeout){
  const cur=SH.cur,p=cur.p,k=cur.k,Pr=PROCS[k],req=Pr.steps.filter(x=>!cur.auto.includes(x.s));SH.cur=null;
  const exec=cur.exec,miss=req.filter(x=>!exec.includes(x.s)),extra=exec.filter(x=>!req.some(r=>r.s===x));
  const ord=exec.filter(x=>req.some(r=>r.s===x)).map(x=>req.findIndex(r=>r.s===x));let inv=0;for(let i=0;i<ord.length;i++)for(let j=i+1;j<ord.length;j++)if(ord[i]>ord[j])inv++;
  const mat=false;
  const dor=miss.some(x=>x.c==='dor'),proc=miss.some(x=>x.c==='processo'),minor=miss.filter(x=>x.c==='minor').length;
  const consK=miss.filter(x=>CONS[x.c]).sort((a,b)=>CONS[b.c].sev-CONS[a.c].sev)[0];
  let pts=minor*15+extra.length*10+inv*15;
  const notes=[];
  if(p.kind==='ret'){const cost=retCost(p.fut);SH.loss+=cost;notes.push(`retorno resolvido, você arcou com ${money(cost)}`);S.agendaFut=S.agendaFut.filter(a=>a!==p.fut);}
  else{let v=procVal(S,k)*SH.price*SH.share*(dor?0.5:1);SH.earn+=v;SH.done++;notes.push(`pagou ${money(v)}`);if(p.kind==='follow')S.agendaFut=S.agendaFut.filter(a=>a!==p.fut);}
  if(dor){SH.rep-=1;notes.push('sentiu dor durante o atendimento');}
  if(proc){timer(S,Math.ceil(rand(3,9)),'processo',{why:`complicação em ${Pr.n.toLowerCase()}`,expl:`Em ${dateL(S.m)}, no(a) ${Pr.n.toLowerCase()} de ${p.nome}, você deixou de fazer: ${miss.filter(x=>x.c==='processo').map(x=>x.s).join(', ')}.`});}
  if(consK){S.agendaFut.push({due:S.m+2+Math.floor(R()*6),kind:'ret',cons:consK.c,from:k,nome:p.nome,at:S.m,miss:`em ${dateL(S.m)}, no(a) ${Pr.n.toLowerCase()}, você deixou de fazer: ${miss.map(x=>x.s).join(', ')}`,pts:40*CONS[consK.c].sev});}
  if(!miss.length&&!extra.length&&!inv){S.mastery[k]=(S.mastery[k]||0)+1;}
  if(Pr.follow&&!consK&&p.kind!=='ret'){const f=Pr.follow;for(let i=0;i<f.n;i++)S.agendaFut.push({due:S.m+f.in*(i+1),kind:'follow',k:f.k,nome:p.nome});}
  SH.pen+=pts;p.st='ok';
  const forgot=miss.map(x=>`${esc(x.s)} → ${CONS[x.c]?CONS[x.c].label:IMM[x.c]}`);
  addRes(`<b>${esc(p.nome)}</b>, ${esc(Pr.n.toLowerCase())}: ${notes.join(', ')}.${timeout?' O tempo acabou e você liberou do jeito que estava.':''}${p.kind==='ret'&&p.fut.miss?` Motivo do retorno: ${esc(p.fut.miss)}.`:''}`,p.kind==='ret'?'bad':'');
  shMsg(p.kind==='ret'?`${esc(p.nome)} foi liberado. Prejuízo: ${money(retCost(p.fut))}.`:`${esc(p.nome)} pagou ${notes[0].replace('pagou ','')} e foi embora.`,p.kind==='ret'?'bad':'good');
}
function shEnd(){
  cancelAnimationFrame(shRAF);
  if(SH.cur){if(SH.cur.stage==='steps')shFinal(true);else{SH.cur.p.st='perdido';SH.lost++;SH.cur=null;}}
  for(const p of SH.pats)if(p.st==='espera'||p.st==='agenda'){p.st='perdido';SH.lost++;}
  let pot=0;for(const p of SH.pats)if(p.st!=='falta'&&p.kind!=='ret'&&procOK(S,p.c.t))pot+=procVal(S,p.c.t)*SH.price*SH.share;

}
function shApply(){
  const r=SH.repo;S.shiftMult=0.4+r.perf;S.perfAvg=(S.perfAvg==null?0.65:S.perfAvg)*0.7+r.perf*0.3;
  S.cash-=SH.loss;S.rep=clamp(S.rep+SH.rep-SH.lost*0.4,0,100);
  const perfect=r.perf>=0.95&&!SH.lost&&!SH.pen;if(perfect){S.rep=Math.min(100,S.rep+1);bon(S,60,'plantão perfeito');}
  if(SH.lost*20+SH.pen)pen(S,SH.lost*20+SH.pen,`plantão: ${SH.lost} paciente(s) perdido(s) e falhas de protocolo`);
  log(S,`Plantão: ${Math.round(r.perf*100)}% de desempenho, ${SH.done} pagaram, ${money(SH.earn)} recebidos, ${money(SH.loss)} de prejuízo.`,r.perf>=0.7?'good':'bad');
}
document.addEventListener('click',e=>{

      else if(procOK(S,p.c.t)){shMsg('Você encaminhou um caso que sabia resolver. Dinheiro perdido.','bad');addRes(`<b>${esc(p.nome)}</b>: encaminhado sem necessidade.`,'bad');}
      else{shMsg(`Boa: ${esc(p.c.n.toLowerCase())} pede ${esc(PROCS[p.c.t].n.toLowerCase())}, que exige especialização.`,'good');SH.rep+=0.1;addRes(`<b>${esc(p.nome)}</b>: encaminhado corretamente.`,'good');}
      shRender();return;}
    if(v!==p.c.t){p.st='falha';SH.err++;SH.cur=null;SH.pen+=40;SH.rep-=0.5;shMsg(`Diagnóstico errado: ${esc(p.c.n.toLowerCase())} pedia ${procOK(S,p.c.t)?esc(PROCS[p.c.t].n.toLowerCase()):'encaminhamento'}. O paciente saiu sem tratar.`,'bad');addRes(`<b>${esc(p.nome)}</b>: diagnóstico errado, saiu sem tratar.`,'bad');
      if(p.kind==='ret'){S.agendaFut=S.agendaFut.filter(a=>a!==p.fut);p.fut.due=S.m+1;S.agendaFut.push(p.fut);}shRender();return;}
    const steps=PROCS[v].steps.map(x=>x.s),auto=SH.asb?steps.filter(x=>x==='Isolamento absoluto'||x==='Isolamento relativo'):[],real=steps.filter(x=>!auto.includes(x));
    const distract=shuffle(ALLSTEPS.filter(x=>!steps.includes(x))).slice(0,Math.min(5,2+Math.floor(real.length/2)));
    const ms=mastery(S,v),per=(3.2+S.skill/100*1.6)*ms.t,tm=real.length*per+3;

  if(cur.stage!=='steps'||SH.brk>0)return;
  if(a==='st'){if(!cur.exec.includes(v))cur.exec.push(v);shRender();}

function jlog(t,k){J.hist.unshift({d:today().split('-').reverse().slice(0,2).join('/'),t,k});J.hist=J.hist.slice(0,80);}
function rxStart(st){
  if(locked()){gView='lock';renderG();return;}
  const lv=J.level,n=4+lv,tasks=[];let id=0;
  const ch=shuffle(JCHOICE.filter(c=>c.st===st)),pr=Object.entries(JPROTO).find(([k,p])=>p.st===st)[0],bz=JBUSY.find(b=>b.st===st);
  const plan=[];for(let i=0;i<n;i++)plan.push(i%2===0?{k:'proto'}:{k:'choice'});plan.splice(Math.floor(n/2),0,{k:'busy'});
  let ci=0;for(const p of plan){let t;
    if(p.k==='proto'){const P=JPROTO[pr];t={type:'proto',key:pr,n:P.n,q:st==='rec'?`${pick(NAMES)} ${pick(SUR)} chegou para a consulta.`:`Bandeja da sala ${1+Math.floor(R()*4)} com ${pick(['instrumental de dentística','kit de cirurgia','kit de endodontia','kit clínico'])}.`};}
    else if(p.k==='choice'){const C=ch[ci++%ch.length];t={type:'choice',c:C,n:C.n,q:C.q,opts:shuffle(C.o.map((o,i)=>({l:o[0],cons:o[1]})))};}
    else t={type:'busy',b:bz,n:bz.n,q:bz.q};
    tasks.push(Object.assign(t,{id:id++,arr:2+tasks.length*(70/(n+1))+rand(-1,1),pat:Math.max(16,34-lv*3)+rand(-3,3),st:'agenda',pts:0}));}
  // consequências que vencem agora entram como surpresa no meio da rodada
  const due=J.latent.filter(x=>x.due<=J.rounds+1);J.latent=J.latent.filter(x=>x.due>J.rounds+1);
  for(const d of due)tasks.push({id:id++,type:'cons',d,n:'Problema: veio do setor '+(ST[d.from]?ST[d.from].n:''),q:d.effect,arr:rand(15,60),pat:999,st:'agenda',pts:0});
  tasks.forEach(t=>t.pmax=t.pat);
  RX={st,lv,t:0,dur:90,tasks,cur:null,phase:'intro',earned:0,possible:tasks.filter(t=>t.type!=='cons').length*10,lost:0,msg:''};
  jrOpen();rxRender();
}

function jrClose(){const el=$('#jrx');if(el){el.hidden=true;el.innerHTML='';}cancelAnimationFrame(rxRAF);RX=null;}
const rxClock=t=>{const m=Math.min(600,Math.round(t/RX.dur*600));return String(8+Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
function rxRender(){
  const el=$('#jrx');if(!el||!RX)return;const S0=ST[RX.st];
  if(RX.phase==='intro'){el.innerHTML=`<div class="in"><div class="report"><h2>${S0.n} · nível ${RX.lv}</h2><p>${RX.tasks.filter(t=>t.type!=='cons').length} tarefas vão chegar durante o expediente. Você tem <b>90 segundos</b>.</p>
    <div class="tip">Toque numa tarefa da lista para assumir. Algumas pedem uma decisão, outras um protocolo montado de memória, na ordem. Quem espera demais desiste. O resultado de cada escolha nem sempre aparece na hora.</div>
    <div class="adv" style="justify-content:flex-start"><button class="btn gold" data-j="go">Começar</button><button class="btn" data-j="quit">Voltar</button></div></div></div>`;return;}
  if(RX.phase==='report'){const sc=RX.score;el.innerHTML=`<div class="in"><div class="report"><h2>Fim da rodada</h2>
    <div><span class="big" style="color:${sc>=70?'var(--ok)':'var(--bad)'}">${sc}%</span> <span class="mute">${sc>=70?'meta do nível atingida neste setor':'abaixo dos 70% necessários'}</span></div>
    ${RX.lost?`<p class="mute" style="margin:0">Problemas de rodadas anteriores tiraram ${RX.lost} pontos.</p>`:''}${RX.lvlUp?`<div class="tip"><b>${RX.lvlUp}</b></div>`:''}
    <div class="adv" style="justify-content:flex-start"><button class="btn gold" data-j="close">Continuar</button></div></div></div>`;return;}
  const cur=RX.cur,stl={agenda:'a caminho',espera:'esperando',feito:'feito',perdido:'desistiu',ativo:'em andamento'};
  let work='';
  if(!cur)work=`<p class="mute">${RX.tasks.some(t=>t.st==='espera')?'Toque numa tarefa para assumir.':'Aguardando a próxima tarefa…'}</p>`;
  else{const t=cur.t;work=`<div class="quote">${esc(t.n)}</div><p style="margin:0">${esc(t.q)}</p>`;
    if(t.type==='choice')work+=`<div class="opts">${t.opts.map((o,i)=>`<button class="btn" data-j="opt" data-v="${i}">${esc(o.l)}</button>`).join('')}</div>`;
    if(t.type==='proto')work+=`<div class="tbar"><i id="jtb" style="width:${cur.tl/cur.tmax*100}%"></i></div><div class="seq">${cur.exec.length?cur.exec.map((x,i)=>`<span class="ok">${i+1}. ${esc(x)}</span>`).join(''):'<span>nenhuma etapa ainda</span>'}</div>
      <div class="steps">${cur.box.filter(x=>!cur.exec.includes(x)).map(x=>`<button class="btn" data-j="step" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
      <div class="adv" style="justify-content:flex-start"><button class="btn gold" data-j="fin">Concluir</button><button class="btn sm" data-j="undo" ${cur.exec.length?'':'disabled'}>Desfazer última</button></div>`;
    if(t.type==='busy'||t.type==='cons')work+=`${t.type==='cons'?`<div class="tip" style="border-left-color:var(--bad)"><b>Por que isso aconteceu?</b> ${esc(t.d.why)}</div>`:''}<div class="tbar"><i id="jtb" style="width:${(1-cur.left/cur.secs)*100}%;background:var(--accent)"></i></div><p class="mute" style="margin:0">Ocupado… você não consegue fazer outra coisa agora.</p>`;}
  el.innerHTML=`<div class="in"><div class="shbar"><div><div class="clock" id="jclk">${rxClock(RX.t)}</div><span class="mute" style="font-size:12px">${S0.n} · nível ${RX.lv}</span></div>
    <div class="daybar"><i id="jdb" style="width:${RX.t/RX.dur*100}%"></i></div><div class="shstats"><div><b>${RX.tasks.filter(t=>t.st==='feito').length}</b>feitas</div><div><b style="color:var(--bad)">${RX.tasks.filter(t=>t.st==='perdido').length}</b>desistiram</div><button class="btn sm" data-j="end">Encerrar</button></div></div>
    <div class="shmsg">${esc(RX.msg)}</div>
    <div class="shgrid"><div class="wait"><h3 style="margin:0">Tarefas</h3>${RX.tasks.filter(t=>t.st!=='agenda').map(t=>{const w=t.st==='espera';return `<button class="pcard ${t.type==='cons'?'urg':''} ${w?'':'dim'}" ${w&&!cur?`data-j="take" data-v="${t.id}"`:'tabindex="-1"'}><span class="pn">${esc(t.n)}</span><span class="st">${stl[t.st]||''}</span>${w&&t.type!=='cons'?`<span class="pb"><i id="jpb${t.id}" style="width:${t.pat/t.pmax*100}%;background:${t.pat<7?'var(--bad)':'var(--ok)'}"></i></span>`:''}</button>`;}).join('')}</div>
    <div class="chairbox"><h3 style="margin:0">Sua bancada</h3>${work}</div></div></div>`;
}
function rxLoop(ts){
  if(!RX||RX.phase!=='play')return;const dt=Math.min(0.1,(ts-(RX.last||ts))/1000);RX.last=ts;RX.t+=dt;let ch=false;
  for(const t of RX.tasks){if(t.st==='agenda'&&RX.t>=t.arr){t.st='espera';ch=true;}
    if(t.st==='espera'&&t.type!=='cons'){t.pat-=dt;if(t.pat<=0){t.st='perdido';ch=true;RX.msg=`"${t.n}" ficou sem resposta.`;if(t.type==='busy')jLatent(t.b.cons,`Na rodada de ${ST[RX.st].n} do nível ${RX.lv}, ninguém fez: ${t.b.n.toLowerCase()}.`,10);}}}
  const cur=RX.cur;
  if(cur&&(cur.t.type==='busy'||cur.t.type==='cons')){cur.left-=dt;if(cur.left<=0){cur.t.st='feito';if(cur.t.type==='busy')RX.earned+=10;RX.cur=null;ch=true;}}
  if(cur&&cur.t.type==='proto'){cur.tl-=dt;if(cur.tl<=0){rxFin();ch=true;}}
  if(RX.t>=RX.dur||!RX.tasks.some(t=>['agenda','espera','ativo'].includes(t.st))){rxEnd();return;}
  if(ch)rxRender();else{const a=$('#jclk');if(a)a.textContent=rxClock(RX.t);const d=$('#jdb');if(d)d.style.width=(RX.t/RX.dur*100)+'%';
    for(const t of RX.tasks)if(t.st==='espera'){const b=$('#jpb'+t.id);if(b){b.style.width=(t.pat/t.pmax*100)+'%';b.style.background=t.pat<7?'var(--bad)':'var(--ok)';}}
    const tb=$('#jtb');if(tb&&RX.cur)tb.style.width=(RX.cur.t.type==='proto'?RX.cur.tl/RX.cur.tmax:1-RX.cur.left/RX.cur.secs)*100+'%';}
  rxRAF=requestAnimationFrame(rxLoop);
}
function jLatent(effect,why,pts){J.latent.push({from:RX.st,due:J.rounds+2+Math.floor(R()*3),effect,why,pts});}
function rxFin(){const cur=RX.cur,t=cur.t,P=JPROTO[t.key],req=P.steps.map(x=>x[0]);
  const miss=P.steps.filter(x=>!cur.exec.includes(x[0])),extra=cur.exec.filter(x=>!req.includes(x));
  const ord=cur.exec.filter(x=>req.includes(x)).map(x=>req.indexOf(x));let inv=0;for(let i=0;i<ord.length;i++)for(let j=i+1;j<ord.length;j++)if(ord[i]>ord[j])inv++;
  RX.earned+=Math.max(0,10*(1-miss.length/req.length)-extra.length*2-inv*2);
  const crit=miss.filter(x=>x[1]);if(crit.length){const x=pick(crit);jLatent(x[1],`Na rodada de ${ST[RX.st].n} do nível ${RX.lv}, em "${P.n.toLowerCase()}", você deixou de fazer: ${x[0].toLowerCase()}.`,10);}
  t.st='feito';RX.cur=null;RX.msg=`"${t.n}" concluído.`;}
function rxEnd(){cancelAnimationFrame(rxRAF);if(RX.cur){if(RX.cur.t.type==='proto')rxFin();else{RX.cur.t.st='perdido';RX.cur=null;}}
  for(const t of RX.tasks)if(t.st==='espera'||t.st==='agenda'){if(t.type==='busy')jLatent(t.b.cons,`Na rodada de ${ST[RX.st].n} do nível ${RX.lv}, ninguém fez: ${t.b.n.toLowerCase()}.`,10);t.st='perdido';}
  const sc=clamp(Math.round((RX.earned-RX.lost)/Math.max(1,RX.possible)*100),0,100);RX.score=sc;
  J.rounds++;const k=jKey(RX.lv,RX.st);J.best[k]=Math.max(J.best[k]||0,sc);
  jlog(`${ST[RX.st].n}, nível ${RX.lv}: ${sc}%.${RX.lost?` Problemas antigos custaram ${RX.lost} pontos.`:''}`,sc>=70?'good':'bad');
  if(J.level===RX.lv&&jSectors().every(st=>jPass(RX.lv,st))){J.level++;
    if(J.level>5){const c=gcfg();RX.lvlUp='Você concluiu os 5 níveis e chegou ao topo!';if(c.prize&&!J.prizeWon&&HOSTED){J.prizeWon={pending:true,prize:c.prize,code:'(registrando…)'};jsave(true);hostPost({type:'dp:prize',module:'jobrotation'});RX.lvlUp+=` Prêmio: ${c.prize}. O código aparece em instantes.`;}
    else if(c.prize&&!J.prizeWon){let h=0;for(const ch of J.name+'|jr|'+today())h=(h*31+ch.charCodeAt(0))>>>0;J.prizeWon={prize:c.prize,code:'JR-'+h.toString(36).toUpperCase().slice(0,6)};c.winners.unshift({name:J.name,diff:'Job Rotation',prize:c.prize,code:J.prizeWon.code,day:today()});gsave(c);RX.lvlUp+=` Prêmio: ${c.prize}. Código para o gestor: ${J.prizeWon.code}.`;}jlog('Chegou ao topo do Job Rotation!','gold');}
    else{RX.lvlUp=`Você passou para o nível ${J.level}.`;jlog(RX.lvlUp,'gold');}}
  jsave();RX.phase='report';rxRender();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-j]');if(!b||b.disabled)return;const a=b.dataset.j,v=b.dataset.v;
  if(a==='enter'){if(locked()){gView='lock';renderG();return;}const nm=($('#pname')&&$('#pname').value.trim())||'';J=jload()||jNew(nm);if(nm&&J.name==='Você')J.name=nm;jsave();MODE='jr';render();return;}
  if(a==='menu'){MODE=null;render();return;}
  if(!J)return;
  if(a==='play'){rxStart(v);return;}
  if(!RX)return;
  if(a==='quit'){jrClose();render();return;}
  if(a==='go'){RX.phase='play';RX.last=0;rxRender();rxRAF=requestAnimationFrame(rxLoop);return;}
  if(a==='close'){jrClose();render();if(locked())showLock();return;}
  if(a==='end'){rxEnd();return;}
  if(RX.phase!=='play')return;
  if(a==='take'&&!RX.cur){const t=RX.tasks.find(x=>x.id==+v);if(!t||t.st!=='espera')return;t.st='ativo';
    if(t.type==='proto'){const req=JPROTO[t.key].steps.map(x=>x[0]),dis=shuffle(ALLJSTEPS.filter(x=>!req.includes(x))).slice(0,3),tm=req.length*(3.6-RX.lv*0.25)+3;RX.cur={t,exec:[],box:shuffle([...req,...dis]),tmax:tm,tl:tm};}
    else if(t.type==='busy')RX.cur={t,secs:t.b.secs,left:t.b.secs};
    else if(t.type==='cons'){RX.cur={t,secs:5,left:5};RX.lost+=t.d.pts;RX.msg='Um problema antigo apareceu.';}
    else RX.cur={t};rxRender();return;}
  const cur=RX.cur;if(!cur)return;
  if(a==='opt'&&cur.t.type==='choice'){const o=cur.t.opts[+v];if(!o.cons)RX.earned+=10;else jLatent(o.cons,`Na rodada de ${ST[RX.st].n} do nível ${RX.lv}, em "${cur.t.n.toLowerCase()}", você escolheu: ${o.l.toLowerCase()}.`,10);cur.t.st='feito';RX.cur=null;RX.msg=`"${cur.t.n}" resolvido.`;rxRender();return;}
  if(a==='step'&&cur.t.type==='proto'){if(!cur.exec.includes(v))cur.exec.push(v);rxRender();return;}
  if(a==='undo'&&cur.t.type==='proto'){cur.exec.pop();rxRender();return;}
  if(a==='fin'&&cur.t.type==='proto'){rxFin();rxRender();return;}
});

/* ============ boot ============ */
function migrate(s){if(!s)return s;if(!s.study){s.study={imersao:null,esp:null,acad:null};if(s.course){const C=COURSES[s.course.k];if(C)s.study[C.tr]={k:s.course.k,left:s.course.left};}delete s.course;}if(s.eduSpent===undefined)s.eduSpent=0;if(s.g&&s.g.registro===undefined)Object.assign(s.g,{registro:true,lab:'ref',equip:'novo',manut:false});if(!s.risks)s.risks=[];
  if(!s.g){s.g={preco:1,mat:1,confirm:false,receb:'cartao',pj:false,atrasar:false,tcle:false};s.lic={alvara:true,sanitaria:!!s.bio,pgrss:true,rt:true,raiox:true,avcb:true};s.ins={rc:!!s.seguro,emp:false,dit:false,fianca:false,auto:false};
    Object.assign(s,{holding:false,holdInv:false,pacto:false,reserva:true,taxDebt:0,ditBase:0,raioxOff:0});delete s.seguro;delete s.bio;}
  return s;}
function start(data){
  if(data&&data.s)S=migrate(data.s);
  render();if(S)openModal();
  if(!reduce)anim=requestAnimationFrame(loop);
}
function hostBoot(){
  let started=false;
  window.addEventListener('message',e=>{
    if(e.origin!==location.origin||!e.data||typeof e.data.type!=='string')return;const m=e.data;
    if(m.type==='dp:init'){HOSTDATA=m.data;HOSTREM=m.data.usage.remainingSeconds;USE=usage();
      if(started)return;started=true;
      if(HOST_MODULE==='jobrotation'){J=jload()||jNew(HOSTDATA.userName);J.name=HOSTDATA.userName||J.name;MODE='jr';render();if(locked())showLock();}
      else{const st=load();if(st&&st.diff)S=migrate(st);render();if(S)openModal();if(locked()){gView='lock';renderG();}if(!reduce)anim=requestAnimationFrame(loop);}
      const pn=$('#pname');if(pn&&!pn.value)pn.value=(HOSTDATA.userName||'').split(' ')[0];}
    if(m.type==='dp:usage'){HOSTREM=m.remainingSeconds;USE=usage();const t=$('#timeleft');if(t)t.textContent=fmtT(timeLeft());if(locked()&&!SH&&!RX)showLock();}
    if(m.type==='dp:prizeResult'){
      if(m.module==='carreira'&&S){S.prizeWon={prize:m.prize,code:m.code};save();notice={t:'Prêmio registrado!',x:`Você chegou ao topo e ganhou: ${m.prize}. Mostre ao gestor o código ${m.code}. Ele também aparece no painel do gestor no DentalPos.`,k:'good'};render();openModal();}
      if(m.module==='jobrotation'&&J){J.prizeWon={prize:m.prize,code:m.code};jsave(true);if(!RX)render();}}
    if(m.type==='dp:error'){notice={t:'Não deu',x:m.message||'Falha de comunicação com o DentalPos.',k:'bad'};openModal();}
  });
  hostPost({type:'dp:ready'});
}
if(HOSTED)hostBoot();
else{
window.claude?.hot?.snapshot?.(()=>({s:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
