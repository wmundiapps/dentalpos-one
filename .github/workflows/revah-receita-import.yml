# REVAH Leads — carrega a base de empresas (dados abertos de CNPJ da Receita Federal).
# Rodar: GitHub → Actions → "REVAH base da Receita" → Run workflow.
# Também roda sozinho todo dia 20 para atualizar a base com o mês novo.
#
# Segredo (Settings → Secrets and variables → Actions → Secrets):
#   REVAH_DATABASE_URL   URL do banco do REVAH (a mesma DATABASE_URL da Vercel, projeto revah-api)
# Variável opcional (Settings → Secrets and variables → Actions → Variables):
#   REVAH_RECEITA_UFS    estados da carga automática mensal (ex.: PR,SP). Padrão: PR
name: REVAH base da Receita

on:
  workflow_dispatch:
    inputs:
      ufs:
        description: 'Estados, separados por vírgula (ex.: PR,SP,SC)'
        required: true
        default: 'PR'
      cnaes:
        description: 'Opcional: prefixos de CNAE (ex.: 8630,4781). Vazio = todos os segmentos'
        required: false
        default: ''
      month:
        description: 'Opcional: mês da base (AAAA-MM). Vazio = o mais recente'
        required: false
        default: ''
  schedule:
    - cron: '17 6 20 * *'

permissions:
  contents: read

concurrency:
  group: revah-receita-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: revah/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: revah/api/package-lock.json
      - run: npm ci
      - name: Testar acesso ao site da Receita
        continue-on-error: true
        run: curl -sS -o /dev/null -w "Receita respondeu HTTP %{http_code} em %{time_total}s\n" --max-time 60 "https://arquivos.receitafederal.gov.br/index.php/s/YggdBLfdninEJX9" || true
      - name: Importar base de empresas
        env:
          DATABASE_URL: ${{ secrets.REVAH_DATABASE_URL }}
          UFS: ${{ github.event.inputs.ufs || vars.REVAH_RECEITA_UFS || 'PR' }}
          CNAES: ${{ github.event.inputs.cnaes }}
          MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "Cadastre o segredo REVAH_DATABASE_URL em Settings → Secrets and variables → Actions."; exit 1; fi
          ARGS="--ufs=$UFS"
          [ -n "$CNAES" ] && ARGS="$ARGS --cnaes=$CNAES"
          [ -n "$MONTH" ] && ARGS="$ARGS --month=$MONTH"
          npm run receita:import -- $ARGS
