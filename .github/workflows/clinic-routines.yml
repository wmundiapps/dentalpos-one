name: Rotinas das clínicas (de hora em hora)

# Lembretes de consulta, avisos do laboratório, cobrança, retorno de pacientes e resumos por e-mail.
# Das 8h às 20h de Brasília (11h às 23h UTC). O servidor decide o que já está na hora e nunca repete o que já enviou.
on:
  schedule:
    - cron: '7 11-23 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # token OIDC que a API confere; não existe senha para esta rotina

concurrency:
  group: clinic-routines
  cancel-in-progress: false

jobs:
  rotinas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Pedir ao DentalPos a rodada de rotinas
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=dentalpos-routines" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          curl -sS -m 240 -X POST -H "Authorization: Bearer $TOKEN" https://api.dentalpos.com.br/api/cron/reminders -w '\nHTTP %{http_code}\n'
