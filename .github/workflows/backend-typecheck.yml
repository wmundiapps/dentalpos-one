name: Backend — conferir tipos (PR)

# Compila o backend (prisma generate + tsc --noEmit) em todo PR que mexe no backend.
# Não usa segredos nem acessa o banco; só confere se o código compila antes de mesclar.
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-typecheck.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
