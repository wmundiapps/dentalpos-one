# Cashbacksmart: gera o app Android (AAB para a Google Play).
# Segredos: CASHBACKSMART_APP_URL, ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Cashbacksmart Android
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cashbacksmart/mobile } }
    env:
      APP_URL: ${{ secrets.CASHBACKSMART_APP_URL }}
      KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npx cap sync android
      - name: Chave de assinatura
        if: ${{ env.KS != '' }}
        run: echo "$KS" | base64 -d > android/app/release.keystore
      - run: cd android && ./gradlew bundleRelease assembleDebug
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: cashbacksmart-android, path: 'cashbacksmart/mobile/android/app/build/outputs/**/*.a*' }
