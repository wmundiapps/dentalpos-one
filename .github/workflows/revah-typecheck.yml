name: REVAH — conferir tipos e testes puros (PR)

# Compila a API (prisma generate + tsc --noEmit) e o painel (tsc --noEmit) do REVAH em todo PR que mexe no revah/.
# Não usa segredos nem acessa o banco.
on:
  pull_request:
    paths:
      - 'revah/**'
      - '.github/workflows/revah-typecheck.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: revah/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: revah/api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: revah/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: revah/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
