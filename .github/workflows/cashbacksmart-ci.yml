# Cashbacksmart: testes automáticos a cada alteração (regras de negócio, segurança, ponta a ponta e vulnerabilidades)
name: Cashbacksmart CI
on:
  push:
    branches: [main]
    paths: ['cashbacksmart/app/**', '.github/workflows/cashbacksmart-ci.yml']
  pull_request:
    paths: ['cashbacksmart/app/**', '.github/workflows/cashbacksmart-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cashbacksmart/app } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ['5433:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5433/cashbacksmart_test
      E2E_DATABASE_URL: postgres://postgres@localhost:5433/cashbacksmart_e2e
      DATABASE_URL: postgres://postgres@localhost:5433/cashbacksmart_e2e
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cashbacksmart/app/package-lock.json }
      - run: psql -h localhost -p 5433 -U postgres -c "create database cashbacksmart_test" -c "create database cashbacksmart_e2e"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright, path: cashbacksmart/app/test-results }
