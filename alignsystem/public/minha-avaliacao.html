<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Minha avaliação — AlignSystem</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
<div class="top"><div class="in">
  <a class="logo" href="/" aria-label="AlignSystem — página inicial"><picture><source srcset="/assets/logo-branca.svg" media="(prefers-color-scheme: dark)"><img src="/assets/logo-cor.svg" alt="AlignSystem" width="210" height="36"></picture></a>
  <a class="btn btn-line btn-sm hidden" id="helpWa" target="_blank" rel="noopener">Ajuda no WhatsApp</a>
</div></div>

<main class="container" id="app">
  <div class="card center"><span class="spinner"></span> <span class="muted">Carregando sua avaliação…</span></div>
</main>

<script src="/assets/app.js"></script>
<script>
(function () {
  'use strict';
  var esc = AS.esc;
  var params = new URLSearchParams(location.search);
  var T = params.get('t');
  var app = document.getElementById('app');
  var state = null;
  var attSim = null; // simulação do atendimento presencial
  var attEdit = false;
  var showPhotos = false;
  var scanOpen = false; // depois do envio, as fotos ficam recolhidas
  var cfg = {};
  var busy = {};

  if (!T) {
    app.innerHTML = '<div class="card"><h1>Link incompleto</h1><p class="muted">Abra o link pessoal que você recebeu por WhatsApp ou e-mail. Se não encontrar, <a href="/#avaliacao">faça seu cadastro</a> ou fale com a equipe.</p></div>';
    return;
  }
  // Mantém o token fora do histórico de referência de terceiros
  try { history.replaceState(null, '', location.pathname + '?t=' + encodeURIComponent(T)); } catch (e) { /* ignore */ }

  fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
    cfg = c || {};
    if (cfg.whatsapp) {
      var h = document.getElementById('helpWa');
      h.href = AS.waLink(cfg.whatsapp, 'Olá! Estou na minha página de avaliação AlignSystem e preciso de ajuda.');
      h.classList.remove('hidden');
    }
  }).catch(function () {});

  function load() {
    return AS.api('/api/portal/' + encodeURIComponent(T)).then(function (d) { state = d; render(); })
      .catch(function (e) {
        app.innerHTML = '<div class="card"><h1>Não encontramos sua avaliação</h1><p class="muted">' + esc(e.message) + '</p><p><a href="/#avaliacao">Fazer um novo cadastro</a></p></div>';
      });
  }

  var STEPS = ['novo', 'fotos_enviadas', 'parecer_enviado', 'documentacao_agendada', 'documentacao_realizada', 'plano_apresentado', 'contrato_enviado', 'contrato_assinado', 'em_tratamento', 'finalizado'];

  function photoFor(slot) {
    for (var i = 0; i < state.photos.length; i++) if (state.photos[i].slot === slot && state.photos[i].kind === 'avaliacao') return state.photos[i];
    return null;
  }

  function render() {
    var c = state.case;
    var done = state.slots.filter(function (s) { return photoFor(s.slot); }).length;
    var locked = Boolean(c.assessment);
    var idx = Math.max(0, STEPS.indexOf(c.status));
    var html = '';

    if (params.get('novo')) {
      html += '<div class="msg ok"><b>Cadastro recebido, ' + esc(c.firstName) + '!</b> Esta é a sua página pessoal da avaliação. ' +
        'Guarde o link para voltar quando quiser. <button class="btn btn-sm btn-line" id="copyLink" style="margin-left:6px">Copiar meu link</button></div>';
    }

    html += '<div class="card"><h1>Olá, ' + esc(c.firstName) + '.</h1>' +
      '<p class="muted">Caso nº ' + esc(c.code) + ' · Situação: <span class="badge ' + (c.status === 'perdido' ? 'red' : 'green') + '">' + esc(c.statusLabel) + '</span></p>' +
      '<div class="progress" aria-hidden="true">' + STEPS.slice(0, 9).map(function (s, i) { return '<span class="' + (i <= idx && c.status !== 'perdido' ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
      (state.dentist ? '<p class="small muted" style="margin-top:10px">Dentista responsável: <b>' + esc(state.dentist.name) + '</b> · CRO-' + esc(state.dentist.croUf || '') + ' ' + esc(state.dentist.cro) + '</p>' : '') +
      '</div>';

    // Termo de consentimento (obrigatório antes do atendimento a distância)
    if (state.tcle) {
      html += '<div class="card" id="tcle"><h2>Antes de começar: termo de consentimento</h2>' +
        '<p class="muted">Parte do seu atendimento é feita a distância. Leia o termo abaixo e confirme para liberar o envio das fotos e a teleorientação.</p>' +
        '<div class="doc tcle-box" tabindex="0" aria-label="Texto do termo de consentimento">' + state.tcle.body + '</div>' +
        '<form id="tcleForm">' +
        (c.isMinor ? '<div class="msg warn">Paciente menor de 18 anos: o termo deve ser aceito pelo pai, pela mãe ou pelo responsável legal, maior de 18 anos.</div>' : '') +
        '<p class="small muted">O termo só pode ser aceito por pessoa maior de 18 anos.</p>' +
        '<div class="grid2"><div class="field"><label for="acceptedName">' + (c.isMinor ? 'Nome completo do responsável legal' : 'Seu nome completo') + '</label>' +
        '<input id="acceptedName" autocomplete="name" required minlength="5" value="' + (c.isMinor ? '' : esc(c.name)) + '"></div>' +
        '<div class="field"><label for="birthDate">' + (c.isMinor ? 'Data de nascimento do responsável' : 'Sua data de nascimento') + '</label>' +
        '<input id="birthDate" type="date" required max="' + new Date().toISOString().slice(0, 10) + '"></div></div>' +
        '<div class="check field"><input type="checkbox" id="tcleAdult" required><label for="tcleAdult">Declaro que sou <b>maior de 18 anos</b>' + (c.isMinor ? ' e responsável legal do(a) paciente' : '') + '.</label></div>' +
        '<div class="check field"><input type="checkbox" id="tcleAgree" required><label for="tcleAgree"><b>Li e aceito</b> o Termo de Consentimento Livre e Esclarecido para atendimento odontológico a distância, inclusive que as teleconferências não são gravadas e não podem ser recuperadas.</label></div>' +
        '<button class="btn btn-primary" type="submit">Confirmar e continuar</button>' +
        '<p class="small muted" style="margin-top:10px">Seu aceite fica registrado com nome, data de nascimento, data e hora, endereço IP e o código de integridade do texto. <a href="/termo-consentimento" target="_blank">Abrir o termo em outra página</a>.</p>' +
        '<div id="tcleMsg"></div></form></div>';
    }

    // Parecer
    if (c.assessment) {
      html += '<div class="card"><h2>Parecer da pré-avaliação</h2>' +
        '<p><span class="badge ' + (c.assessment === 'nao_indicado' ? 'red' : c.assessment === 'indicado' ? 'green' : 'honey') + '">' + esc(c.assessmentLabel) + '</span></p>' +
        (c.assessmentNotes ? '<p style="white-space:pre-line">' + esc(c.assessmentNotes) + '</p>' : '') +
        '<p class="small muted">A pré-avaliação por fotos é orientativa. A indicação do tratamento é confirmada no exame e na documentação presenciais.</p></div>';
    }

    // Escaneamento (depois do parecer)
    var S = state.scan;
    if (S) {
      var O = S.order;
      var money = function (v) { return v ? AS.money(v) : 'a definir'; };
      html += '<div class="card" id="escaneamento">';
      if (O && (O.status === 'pago' || O.status === 'agendado' || O.status === 'realizado')) {
        html += '<h2>Escaneamento pago ✓</h2>';
        if (O.status === 'agendado') html += '<div class="msg ok">Seu escaneamento está agendado. Veja a data e o local em "Teleorientação e agendamentos", abaixo.</div>';
        else if (O.status === 'realizado') html += '<div class="msg ok">Escaneamento realizado. O dentista está preparando o seu plano de tratamento.</div>';
        else if (O.preference) html += '<div class="msg ok">Recebemos sua preferência de horário: <b>' + esc(O.preference) + '</b>. Nossa equipe confirma a data e o local pelo WhatsApp.</div>';
        else html += '<p>Pagamento confirmado. Agora diga os melhores dias e horários para você:</p>' +
          '<form id="scanPref"><div class="field"><label for="spref">Melhores dias e horários</label><input id="spref" maxlength="300" placeholder="Ex.: segunda ou quarta à tarde" required></div>' +
          '<button class="btn btn-primary btn-sm" type="submit">Enviar</button><div id="scanPrefMsg"></div></form>';
      } else {
        html += '<h2>Próximo passo: escaneamento</h2>' +
          '<p>O escaneamento digital dos dentes e a documentação mostram ao dentista o grau de dificuldade do seu caso e permitem montar o seu plano de tratamento.</p>';
        if (O && O.status === 'aguardando_pagamento' && O.invoiceUrl) {
          html += '<div class="msg warn">Seu pagamento do escaneamento está pendente. <a class="btn btn-primary btn-sm" href="' + esc(O.invoiceUrl) + '">Pagar agora</a></div>';
        }
        if (!scanOpen) {
          html += '<button class="btn btn-primary" id="scanOpen" style="font-size:16px;padding:14px 24px;letter-spacing:.02em">AGENDAR ESCANEAMENTO</button>';
        } else {
          var P = S.prefill || {};
          html += '<div class="msg ok" style="font-size:16px">Valor do escaneamento e da documentação: <b>' + esc(money(S.price)) + '</b></div>' +
            '<h3 style="margin-top:16px">Valores do tratamento por grau de dificuldade</h3>' +
            (S.options && S.options.length ? (function () {
              var O = S.options, n = O.length, LBL = { simples: 'Caso simples', mediano: 'Média complexidade', complexo: 'Caso complexo' };
              var row = function (label, sub, cells) { return '<tr><th scope="row">' + label + (sub ? '<div class="small muted">' + sub + '</div>' : '') + '</th>' + cells + '</tr>'; };
              var span = function (html) { return '<td colspan="' + n + '" class="span">' + html + '</td>'; };
              return '<p class="small muted">Seu dentista trabalha com ' + (n === 1 ? 'esta opção' : 'estas ' + n + ' opções') + ' de alinhador. A escolha é feita com ele, depois do escaneamento.</p>' +
                '<div class="price-grid"><table style="--n:' + n + '"><thead><tr><th></th>' + O.map(function (o, i) {
                  return '<th scope="col"><div class="small muted">Opção ' + (i + 1) + '</div>' + esc(o.name) + '<div class="small muted">' + (o.origin === 'importado' ? 'importado' : 'nacional') + '</div></th>';
                }).join('') + '</tr></thead><tbody>' +
                row('Escaneamento e submissão do caso', 'pago agora e descontado do valor do tratamento', span('<b>' + esc(money(S.price)) + '</b>')) +
                ['simples', 'mediano', 'complexo'].map(function (k, idx) {
                  return row(LBL[k], 'até ' + S.table[idx].consults + ' consultas incluídas', O.map(function (o) { var r = o.table[idx]; return '<td><b>' + (r.price ? esc(money(r.price)) : '—') + '</b></td>'; }).join(''));
                }).join('') +
                row('Refinamento', 'por consulta', O.map(function (o) { return '<td>' + (o.refValue ? '<b>' + esc(money(o.refValue)) + '</b>' + (o.refCount ? '<div class="small muted">' + o.refCount + ' consulta' + (o.refCount > 1 ? 's' : '') + '</div>' : '') : '—') + '</td>'; }).join('')) +
                (S.breakage ? row('Consulta por quebra ou perda de alinhador', 'cobrada à parte', span('<b>' + esc(money(S.breakage)) + '</b>')) : '') +
                '</tbody></table></div>';
            })()
            : '<div class="list">' + S.table.map(function (r) {
              return '<div class="it"><div><b>' + ({ simples: 'Caso simples', mediano: 'Média complexidade', complexo: 'Caso complexo' })[r.key] + '</b><div class="small muted">até ' + r.consults + ' consultas incluídas</div></div><b style="white-space:nowrap">' + esc(money(r.price)) + '</b></div>';
            }).join('') + '</div>') +
            '<p class="small muted">O grau do seu caso é definido pelo dentista depois do escaneamento. Formas de pagamento do tratamento: Pix com ' + S.pixDiscountPct + '% de desconto, cartão em até ' + S.cardMaxInstallments + 'x sem juros, ou entrada de 50% e o restante em até ' + S.boletoMaxInstallments + ' boletos.</p>' +
            '<form id="scanForm"><h3 style="margin-top:18px">Seus dados</h3><div class="grid2">' +
            '<div class="field"><label for="sname">Nome completo</label><input id="sname" autocomplete="name" required value="' + esc(P.name || '') + '"></div>' +
            '<div class="field"><label for="scpf">CPF</label><input id="scpf" inputmode="numeric" required value="' + esc(P.cpf || '') + '"></div>' +
            '<div class="field"><label for="semail">E-mail</label><input id="semail" type="email" autocomplete="email" required value="' + esc(P.email || '') + '"></div>' +
            '<div class="field"><label for="swa">Celular (WhatsApp)</label><input id="swa" type="tel" autocomplete="tel" required value="' + esc(P.whatsapp || '') + '"></div>' +
            '<div class="field"><label for="scep">CEP</label><input id="scep" inputmode="numeric" autocomplete="postal-code" required value="' + esc(P.postalCode || '') + '"></div>' +
            '<div class="field"><label for="saddr">Endereço com número</label><input id="saddr" autocomplete="street-address" required></div>' +
            '<div class="field"><label for="scity">Cidade</label><input id="scity" required value="' + esc(P.city || '') + '"></div>' +
            '<div class="field"><label for="suf">Estado</label><select id="suf" required><option value="">UF</option>' + state.ufs.map(function (u) { return '<option' + (P.uf === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></div></div>' +
            '<div class="tcle-box">' + (S.terms ? S.terms.body : '') + '</div>' +
            '<div class="check field"><input type="checkbox" id="sagree" required><label for="sagree"><b>Li e aceito</b> o termo de contratação do escaneamento.</label></div>' +
            '<h3>Forma de pagamento do escaneamento</h3>' +
            '<div class="check field"><input type="radio" name="sbill" id="sbc" value="CREDIT_CARD" checked><label for="sbc">Cartão de crédito</label></div>' +
            '<div class="check field"><input type="radio" name="sbill" id="sbp" value="PIX"><label for="sbp">Pix</label></div>' +
            '<button class="btn btn-primary" type="submit">Ir para o pagamento</button><div id="scanMsg"></div></form>';
        }
      }
      html += '</div>';
    }

    // Fotos
    if (state.tcle) {
      html += '<div class="card"><h2>Envio das fotos e teleorientação</h2><p class="muted">Liberados assim que você aceitar o termo de consentimento acima.</p></div>';
    }
    if (!state.tcle) {
    if (!locked && c.photosSubmittedAt && !showPhotos) {
      html += '<div class="card" id="fotos"><h2>Fotos enviadas ✓</h2>' +
        '<div class="msg ok">Suas 7 fotos chegaram para a equipe AlignSystem em ' + esc(AS.date(c.photosSubmittedAt, true)) + '. ' +
        'Agora é só aguardar: o parecer aparece aqui nesta página' + (cfg.whatsapp ? ' e avisamos pelo WhatsApp' : '') + '. Você não precisa fazer mais nada.</div>' +
        '<button class="btn btn-line btn-sm" id="showPhotos">Ver ou trocar as fotos</button></div>';
    } else {
    html += '<div class="card" id="fotos"><h2>' + (locked ? 'Suas fotos' : 'Envie as 7 fotos do seu sorriso') + '</h2>';
    if (!locked) {
      html += '<p class="muted">Use luz natural, sem flash direto, e retire óculos e batom. Você pode tirar a foto na hora ou escolher da galeria. ' +
        '<a href="/guia-fotos" target="_blank">Ver guia com exemplos</a></p>';
    }
    html += '<p class="small muted">' + done + ' de 7 fotos prontas' + (c.photosSubmittedAt ? '' : ' (ainda não enviadas para a equipe)') + '</p><div class="slots">';
    state.slots.forEach(function (s) {
      var p = photoFor(s.slot);
      html += '<div class="slot' + (p ? ' done' : '') + '" data-slot="' + s.slot + '">' +
        '<div class="thumb">' + (p ? '<img alt="Foto ' + s.slot + '" loading="lazy" src="/api/portal/' + encodeURIComponent(T) + '/photos/' + p.id + '">' : s.slot) + '</div>' +
        '<div class="info"><b>' + s.slot + '. ' + esc(s.title) + '</b>' + esc(s.hint) + '</div>' +
        (locked ? '' : '<div class="act"><label class="btn btn-sm ' + (p ? 'btn-line' : 'btn-green') + '" style="margin:0;color:inherit">' +
          '<input type="file" accept="image/*" data-up="' + s.slot + '">' + (p ? 'Trocar foto' : 'Enviar foto') + '</label></div>') +
        (busy[s.slot] ? '<div class="busy"><span class="spinner"></span></div>' : '') +
        '</div>';
    });
    html += '</div>';
    if (!locked) {
      if (c.photosSubmittedAt) {
        html += '<div class="msg ok" style="margin-top:14px">Fotos enviadas para a equipe em ' + esc(AS.date(c.photosSubmittedAt, true)) + '. Se trocar alguma foto, clique em "Reenviar para avaliação".</div>';
      }
      html += '<div class="row" style="margin-top:14px"><button class="btn btn-primary" id="submitPhotos"' + (done < 7 ? ' disabled' : '') + '>' +
        (c.photosSubmittedAt ? 'Reenviar para avaliação' : 'Enviar fotos para avaliação') + '</button>' +
        (done < 7 ? '<span class="small muted">Faltam ' + (7 - done) + ' foto(s).</span>' : '') + '</div><div id="photoMsg"></div>';
    }
    html += '</div>';
    }
    }

    // Agendamentos
    if (!state.tcle) {
    html += '<div class="card"><h2>Teleorientação e agendamentos</h2>';
    if (state.appointments.length) {
      html += '<div class="list">';
      state.appointments.forEach(function (a) {
        var start = new Date(a.starts_at).getTime();
        var now = Date.now();
        var open = a.room_url && now > start - 15 * 60000 && now < start + 3 * 3600000;
        var kind = a.kind === 'teleorientacao' ? 'Teleorientação por vídeo' : a.kind === 'documentacao' ? 'Documentação (presencial)' : 'Consulta (presencial)';
        html += '<div class="it"><div><b>' + esc(kind) + '</b><div class="small muted">' + esc(AS.date(a.starts_at, true)) +
          (a.dentist_name ? ' · ' + esc(a.dentist_name) : '') + (a.location ? ' · ' + esc(a.location) : '') + '</div></div>' +
          (a.room_url ? (open ? '<a class="btn btn-green btn-sm" target="_blank" rel="noopener" href="' + esc(a.room_url) + '">Entrar na chamada</a>'
            : '<span class="small muted">O botão da chamada aparece 15 min antes</span>') : '') + '</div>';
      });
      html += '</div>';
    } else {
      html += '<p class="muted">Quer conversar por vídeo com a equipe para tirar dúvidas? Peça uma teleorientação e confirmaremos o horário com você.</p>';
    }
    html += '<details style="margin-top:12px"><summary class="btn btn-line btn-sm">Pedir teleorientação</summary>' +
      '<form id="teleForm" style="margin-top:12px"><div class="field"><label for="pref">Melhores dias e horários para você</label>' +
      '<input id="pref" maxlength="300" placeholder="Ex.: terças e quintas depois das 18h" required></div>' +
      '<button class="btn btn-green btn-sm" type="submit">Enviar pedido</button><div id="teleMsg"></div></form></details>' +
      '<p class="small muted" style="margin-top:10px">A teleorientação é uma conversa orientativa por vídeo e não substitui o exame clínico presencial. A chamada abre no navegador, sem instalar nada.</p>' +
      (state.consent ? '<p class="small muted">Termo de consentimento aceito em ' + esc(AS.date(state.consent.acceptedAt, true)) + '. <a href="/termo-consentimento?v=' + encodeURIComponent(state.consent.version) + '" target="_blank">Ver termo</a></p>' : '') + '</div>';
    }

    // Atendimento presencial (questionário)
    if (state.consent) {
      var A = state.attendance;
      var locked = state.case.status === 'contrato_assinado' || state.case.status === 'em_tratamento';
      html += '<div class="card" id="atendimento"><h2>Atendimento presencial</h2>';
      if (A && !attEdit) {
        html += '<p><b>' + esc(A.label) + '</b></p><p class="small muted">Sua cidade: ' + esc(A.city + '/' + A.uf) +
          (A.km != null ? ' · dentista credenciado mais próximo em ' + esc(A.nearestCity + '/' + A.nearestUf) + ' (cerca de ' + A.km + ' km)' : '') + '</p>' +
          (A.travelTotal ? '<p class="small">Os ' + A.trips + ' deslocamentos de ida e volta (ônibus convencional, cerca de ' + esc(AS.money(A.travelPerTrip)) + ' cada) entram no valor do tratamento: ' + esc(AS.money(A.travelTotal)) + '.</p>' : '') +
          (locked ? '' : '<button class="btn btn-line btn-sm" id="attChange">Alterar</button>');
      } else {
        html += '<p class="muted small">As consultas presenciais são feitas por dentistas credenciados da rede AlignSystem. Informe onde você mora para ver as opções.</p>' +
          '<form id="attSim"><div class="grid2"><div class="field"><label for="attUf">Estado</label><select id="attUf" required><option value="">UF</option>' +
          state.ufs.map(function (u) { return '<option' + ((attSim ? attSim.uf : state.case.uf) === u ? ' selected' : '') + '>' + u + '</option>'; }).join('') + '</select></div>' +
          '<div class="field"><label for="attCity">Cidade onde você mora</label><input id="attCity" list="attCities" required autocomplete="address-level2" value="' + esc(attSim ? attSim.city : state.case.city || '') + '"><datalist id="attCities"></datalist></div></div>' +
          '<button class="btn btn-line btn-sm" type="submit">Ver opções de atendimento</button><div id="attSimMsg"></div></form>';
        if (attSim) {
          html += '<form id="attForm" style="margin-top:16px">';
          if (!attSim.nearest) {
            html += '<div class="msg warn">Ainda não temos dentista credenciado perto de você. Envie mesmo assim: nossa equipe vai entrar em contato com as alternativas.</div>';
          } else if (attSim.withinRadius) {
            html += '<p class="small">O dentista credenciado mais próximo fica em <b>' + esc(attSim.nearest.city + '/' + attSim.nearest.uf) + '</b>, a cerca de ' + attSim.nearest.km + ' km.</p>' +
              '<div class="check field"><input type="radio" name="attChoice" id="ch1" value="rede_300" checked><label for="ch1">Aceito ser atendido(a) por <b>qualquer dentista credenciado</b> da rede num raio de até 300 km da minha cidade. As despesas de deslocamento são por minha conta.</label></div>' +
              '<div class="check field"><input type="radio" name="attChoice" id="ch2" value="mais_proximo"><label for="ch2">Prefiro o <b>dentista credenciado mais próximo</b> (' + esc(attSim.nearest.city + '/' + attSim.nearest.uf) + '). As despesas de deslocamento são por minha conta.</label></div>';
          } else {
            html += '<div class="msg warn">O dentista credenciado mais próximo fica em <b>' + esc(attSim.nearest.city + '/' + attSim.nearest.uf) + '</b>, a cerca de ' + attSim.nearest.km + ' km (mais de 300 km). ' +
              'Por isso, o valor de ' + attSim.trips + ' deslocamentos de ida e volta em ônibus convencional (cerca de ' + esc(AS.money(attSim.travelPerTrip)) + ' cada, total ' + esc(AS.money(attSim.travelTotal)) + ') entra no valor do tratamento.</div>' +
              '<input type="hidden" name="attChoice" value="mais_proximo_viagem">';
          }
          html += '<div class="check field"><input type="checkbox" id="attAgree" required><label for="attAgree">Li e concordo com a forma de atendimento presencial escolhida.</label></div>' +
            '<button class="btn btn-primary btn-sm" type="submit">Confirmar</button><div id="attMsg"></div></form>';
        }
      }
      html += '</div>';
    }

    // Contratos
    if (state.contracts.length) {
      html += '<div class="card"><h2>Contrato</h2><div class="list">';
      state.contracts.forEach(function (ct) {
        html += '<div class="it"><div><b>' + esc(ct.title) + '</b><div class="small muted">' +
          (ct.status === 'aceito' ? 'Aceito em ' + esc(AS.date(ct.accepted_at, true)) : 'Aguardando sua leitura e aceite') + '</div></div>' +
          '<a class="btn btn-sm ' + (ct.status === 'aceito' ? 'btn-line' : 'btn-primary') + '" href="' + esc(ct.url) + '">' + (ct.status === 'aceito' ? 'Ver contrato' : 'Ler e aceitar') + '</a></div>';
      });
      html += '</div></div>';
    }

    // Pagamentos
    if (state.charges.length) {
      html += '<div class="card"><h2>Pagamentos</h2><div class="list">';
      state.charges.forEach(function (ch) {
        var pays = (ch.payments || []).filter(function (p) { return p.status !== 'DELETED'; });
        var paid = pays.some(function (p) { return /RECEIVED|CONFIRMED/.test(p.status); });
        var next = pays.filter(function (p) { return p.status === 'PENDING' || p.status === 'OVERDUE'; })[0];
        var how = ch.pay_option === 'PIX' ? 'Pix à vista · ' : ch.pay_option === 'CREDIT_CARD' ? 'Cartão ' + ch.installment_count + 'x · ' : ch.pay_option === 'BOLETO' ? 'Entrada + ' + ch.installment_count + ' boletos · ' : '';
        var link = ch.payUrl || (next && next.invoice_url) || ch.invoice_url;
        html += '<div class="it"><div><b>' + esc(ch.description) + '</b><div class="small muted">' + esc(how) + esc(AS.money(ch.value)) +
          (paid ? ' · pagamento confirmado' : '') + '</div></div>' +
          (link ? '<a class="btn btn-sm ' + (paid ? 'btn-line' : 'btn-primary') + '"' + (ch.payUrl ? '' : ' target="_blank" rel="noopener"') + ' href="' + esc(link) + '">' + (paid ? 'Ver pagamento' : 'Pagar') + '</a>' : '<span class="badge">' + esc(ch.statusLabel) + '</span>') +
          '</div>';
      });
      html += '</div></div>';
    }

    html += '<p class="small muted center">Seus dados e fotos são tratados conforme a <a href="/privacidade">política de privacidade</a>. ' +
      'Dúvidas: <a href="mailto:' + esc(cfg.supportEmail || 'suporte@alignsystem.com.br') + '">' + esc(cfg.supportEmail || 'suporte@alignsystem.com.br') + '</a></p>';

    app.innerHTML = html;
    bind();
  }

  function bind() {
    var so = document.getElementById('scanOpen');
    if (so) so.addEventListener('click', function () { scanOpen = true; render(); var el = document.getElementById('escaneamento'); if (el) el.scrollIntoView({ block: 'start' }); });
    var sf = document.getElementById('scanForm');
    if (sf) sf.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = sf.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Gerando pagamento…';
      var v = function (id) { return document.getElementById(id).value; };
      AS.api('/api/portal/' + encodeURIComponent(T) + '/escaneamento', { method: 'POST', body: {
        name: v('sname'), cpf: v('scpf'), email: v('semail'), whatsapp: v('swa'), postalCode: v('scep'), address: v('saddr'), city: v('scity'), uf: v('suf'),
        agree: document.getElementById('sagree').checked, hash: state.scan.terms && state.scan.terms.hash,
        billingType: sf.querySelector('input[name=sbill]:checked').value,
      } }).then(function (r) { location.href = r.invoiceUrl; })
        .catch(function (err) { btn.disabled = false; btn.textContent = 'Ir para o pagamento'; document.getElementById('scanMsg').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; });
    });
    var sp2 = document.getElementById('scanPref');
    if (sp2) sp2.addEventListener('submit', function (e) {
      e.preventDefault();
      AS.api('/api/portal/' + encodeURIComponent(T) + '/escaneamento/preferencia', { method: 'POST', body: { preference: document.getElementById('spref').value } })
        .then(load).catch(function (err) { document.getElementById('scanPrefMsg').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; });
    });
    var attCh = document.getElementById('attChange');
    if (attCh) attCh.addEventListener('click', function () { attEdit = true; attSim = null; render(); });
    var ufSel = document.getElementById('attUf');
    function loadCities() {
      if (!ufSel || !ufSel.value) return;
      AS.api('/api/geo/cidades?uf=' + ufSel.value).then(function (r) {
        document.getElementById('attCities').innerHTML = r.cities.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
      }).catch(function () {});
    }
    if (ufSel) { ufSel.addEventListener('change', loadCities); loadCities(); }
    var simF = document.getElementById('attSim');
    if (simF) simF.addEventListener('submit', function (e) {
      e.preventDefault();
      var body = { uf: ufSel.value, city: document.getElementById('attCity').value };
      AS.api('/api/portal/' + encodeURIComponent(T) + '/atendimento/simular', { method: 'POST', body: body })
        .then(function (r) { attSim = r; render(); var f = document.getElementById('attForm'); if (f) f.scrollIntoView({ block: 'center' }); })
        .catch(function (err) { document.getElementById('attSimMsg').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; });
    });
    var attF = document.getElementById('attForm');
    if (attF) attF.addEventListener('submit', function (e) {
      e.preventDefault();
      var ch = attF.querySelector('[name=attChoice]:checked') || attF.querySelector('[name=attChoice]');
      var btn = attF.querySelector('button');
      btn.disabled = true;
      AS.api('/api/portal/' + encodeURIComponent(T) + '/atendimento', { method: 'POST', body: { uf: attSim.uf, city: attSim.city, choice: ch ? ch.value : null, agree: document.getElementById('attAgree').checked } })
        .then(function () { attSim = null; attEdit = false; return load(); })
        .catch(function (err) { btn.disabled = false; document.getElementById('attMsg').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; });
    });
    var copy = document.getElementById('copyLink');
    if (copy) copy.addEventListener('click', function () { AS.copy(location.origin + '/minha-avaliacao?t=' + T, copy); });

    Array.prototype.forEach.call(app.querySelectorAll('input[data-up]'), function (inp) {
      inp.addEventListener('change', function () {
        var file = inp.files && inp.files[0];
        if (!file) return;
        var slot = Number(inp.getAttribute('data-up'));
        busy[slot] = true; render();
        AS.compress(file).then(function (blob) {
          return AS.api('/api/portal/' + encodeURIComponent(T) + '/photos?slot=' + slot, { method: 'POST', body: blob });
        }).then(function () {
          delete busy[slot];
          return load();
        }).catch(function (e) {
          delete busy[slot];
          render();
          document.getElementById('photoMsg').innerHTML = '<div class="msg err">Foto ' + slot + ': ' + esc(e.message) + '</div>';
        });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll('.slot img'), function (img) {
      img.addEventListener('click', function () { AS.lightbox(img.src); });
    });

    var sp = document.getElementById('showPhotos');
    if (sp) sp.addEventListener('click', function () { showPhotos = true; render(); });
    var sub = document.getElementById('submitPhotos');
    if (sub) sub.addEventListener('click', function () {
      sub.disabled = true;
      AS.api('/api/portal/' + encodeURIComponent(T) + '/submit', { method: 'POST', body: {} })
        .then(function () { showPhotos = false; return load(); }).then(function () { var el = document.getElementById('fotos'); if (el) el.scrollIntoView({ block: 'start' }); })
        .catch(function (e) { sub.disabled = false; document.getElementById('photoMsg').innerHTML = '<div class="msg err">' + esc(e.message) + '</div>'; });
    });

    var cf = document.getElementById('tcleForm');
    if (cf) cf.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = cf.querySelector('button');
      btn.disabled = true;
      AS.api('/api/portal/' + encodeURIComponent(T) + '/consent', { method: 'POST', body: {
        agree: document.getElementById('tcleAgree').checked, adult: document.getElementById('tcleAdult').checked, hash: state.tcle.hash,
        acceptedName: document.getElementById('acceptedName').value, birthDate: document.getElementById('birthDate').value,
      } }).then(function () { return load(); }).then(function () {
        var f = document.getElementById('fotos'); if (f) f.scrollIntoView({ behavior: 'smooth' });
      }).catch(function (err) { btn.disabled = false; document.getElementById('tcleMsg').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; });
    });

    var tf = document.getElementById('teleForm');
    if (tf) tf.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = tf.querySelector('button');
      btn.disabled = true;
      AS.api('/api/portal/' + encodeURIComponent(T) + '/teleorientacao', { method: 'POST', body: { preference: document.getElementById('pref').value } })
        .then(function () { document.getElementById('teleMsg').innerHTML = '<div class="msg ok">Pedido enviado! A equipe confirma o horário com você.</div>'; })
        .catch(function (err) { btn.disabled = false; document.getElementById('teleMsg').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; });
    });
  }

  load();
})();
</script>
</body>
</html>
