<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Validar cartão — AlignSystem</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css" />
<style>
.vhead{background:#12233A;padding:22px 16px;text-align:center}
.vhead img{height:34px}
.vbox{max-width:520px;margin:0 auto;padding:28px 16px 60px}
.vres{border-radius:14px;padding:20px;margin-top:16px;border:1px solid var(--line);background:var(--card)}
.vres.ok{border-color:var(--emerald)} .vres.no{border-color:var(--danger)}
.vres .st{font:700 20px var(--sans);display:block;margin-bottom:6px}
.vres.ok .st{color:var(--emerald)} .vres.no .st{color:var(--danger)}
.vform{display:flex;gap:8px;margin-top:14px}
.vform input{flex:1;min-width:0}
</style>
</head>
<body>
<div class="vhead"><img src="/assets/logo-branca.svg" alt="AlignSystem"></div>
<main class="vbox">
  <h1>Validar cartão da rede</h1>
  <p class="muted">Confira o cartão do paciente ou do dentista credenciado lendo o QR ou digitando o código.</p>
  <form class="vform" id="f"><input id="c" placeholder="ASP-001042-2710-XXXXXXXX" autocomplete="off" aria-label="Código do cartão"><button class="btn btn-green" type="submit">Validar</button></form>
  <div id="out" aria-live="polite"></div>
  <p class="small muted" style="margin-top:28px">Por privacidade, a validação mostra só o necessário para o atendimento. Dúvidas: fale com a central da AlignSystem.</p>
</main>
<script src="/assets/app.js"></script>
<script>
(function () {
  var A = window.AS, esc = A.esc, out = document.getElementById('out'), input = document.getElementById('c');
  function run(code) {
    if (!code) return;
    out.innerHTML = '<div class="vres"><span class="spinner"></span></div>';
    A.api('/api/public/cartao?c=' + encodeURIComponent(code)).then(function (r) {
      out.innerHTML = r.valid
        ? '<div class="vres ok"><span class="st">✓ ' + esc(r.status) + '</span><b>' + esc(r.name) + '</b><br>' + esc(r.type) + (r.detail ? '<br>' + esc(r.detail) : '') + (r.city ? '<br>' + esc(r.city) : '') + '<br><span class="small muted">Válido até ' + esc(r.validUntil) + '</span></div>'
        : '<div class="vres no"><span class="st">✕ Não validado</span>' + esc(r.message) + '</div>';
    }).catch(function (e) { out.innerHTML = '<div class="vres no"><span class="st">Não foi possível validar agora</span>' + esc(e.message) + '</div>'; });
  }
  document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); run(input.value.trim()); });
  var c = new URLSearchParams(location.search).get('c');
  if (c) { input.value = c; run(c); }
})();
</script>
</body>
</html>
