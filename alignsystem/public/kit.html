<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Cartões e lembretes — AlignSystem</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css" />
<style>
.kit-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px 0 18px}
.kit-tabs a{padding:10px 14px;text-decoration:none;color:var(--ink-60);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.kit-tabs a.on{color:var(--ink);border-bottom-color:var(--emerald)}
.kit-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.kit-grid{grid-template-columns:minmax(0,1fr)}}
.kit-form select,.kit-form input{width:100%}
.kit-prev{display:flex;flex-direction:column;gap:18px;min-width:0}
.kit-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.kit-item{display:flex;flex-direction:column;gap:8px;min-width:0}
.kit-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kit-bar b{margin-right:auto}
.kit-img{width:100%;max-width:640px;height:auto;border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(18,35,58,.12);background:#fff}
.kit-msg{margin:0;padding:14px}
.kit-msg pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font:14px/1.5 var(--sans);background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.kit-dock{position:sticky;bottom:12px;margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(18,35,58,.12)}
.kit-dock>div{margin-right:auto}
</style>
</head>
<body>
<div id="root"><main class="container center"><span class="spinner"></span></main></div>
<script src="/assets/app.js"></script>
<script src="/assets/kit.js"></script>
</body>
</html>
